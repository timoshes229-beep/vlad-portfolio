.vh-aur .a3{width:420px;height:420px;right:-80px;bottom:-60px;background:#ffb38a;opacity:.5;animation:vh-a3 15s ease-in-out infinite alternate}
.vh-aur .a4{width:340px;height:340px;left:38%;top:-180px;background:color-mix(in srgb,var(--ac) 45%,#ffffff);opacity:.45;animation:vh-a2 23s ease-in-out infinite alternate-reverse}
html[data-vtheme="dark"] .vh-aur i{opacity:.32}
@keyframes vh-a1{to{transform:translate(-180px,140px) scale(1.15)}}
@keyframes vh-a2{to{transform:translate(160px,-120px) scale(.9)}}
@keyframes vh-a3{to{transform:translate(-220px,-70px) scale(1.2)}}
@media (max-width:980px){
.vh-aur .a1{width:420px;height:420px;right:-160px;top:auto;bottom:-60px}
.vh-aur .a4{display:none}
}
.vh-acc{font-variant-ligatures:none}
.vh-acc.is-scr{animation:none}
.vh-snav{position:fixed;left:50%;top:14px;z-index:9990;display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;
background:color-mix(in srgb,var(--card) 80%,transparent);border:1px solid var(--line);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);
box-shadow:0 16px 40px -18px var(--shadow);font-family:'Manrope',system-ui,sans-serif;color:var(--fg);-webkit-font-smoothing:antialiased;
transform:translate(-50%,-150%);opacity:0;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s;max-width:calc(100vw - 24px)}
.vh-snav.is-on{transform:translate(-50%,0);opacity:1}
.vh-snav *{box-sizing:border-box;margin:0;padding:0}
.vh-snav a{text-decoration:none;color:inherit}
.vh-snav-logo{padding:0 10px 0 14px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:17px;letter-spacing:-.03em;white-space:nowrap}
.vh-snav-logo i{font-style:normal;color:var(--ac)}
.vh-snav-links{position:relative;display:flex;gap:2px}
.vh-snav-pill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:var(--fg);opacity:0;
transition:transform .5s cubic-bezier(.2,.8,.2,1),width .5s cubic-bezier(.2,.8,.2,1),opacity .3s}
.vh-snav .vh-snav-links a{position:relative;z-index:1;display:block;padding:10px 14px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;transition:color .35s}
.vh-snav .vh-snav-links a:hover{color:var(--fg)}
.vh-snav .vh-snav-links a.is-on{color:var(--bg)}
.vh-snav .vh-snav-cta{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;background:var(--ac);color:#fff;font-size:13.5px;font-weight:700;white-space:nowrap;transition:transform .3s}
.vh-snav .vh-snav-cta:hover{transform:scale(1.04)}
.vh-snav-cta svg{width:15px;height:15px}
.vh-snav-cur{display:none;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vh-snav-cur b{color:var(--ac);margin-right:6px;font-family:'Unbounded',sans-serif;font-size:11px}
@media (max-width:900px){
.vh-snav{width:calc(100vw - 24px);justify-content:space-between;top:10px}
.vh-snav-links{display:none}
.vh-snav-cur{display:block;flex:1;padding:0 6px}
.vh-snav .vh-snav-cta span{display:none}
.vh-snav .vh-snav-cta{width:42px;padding:0;justify-content:center}
}
.vh-photo{position:absolute;inset:0;display:none;overflow:hidden;will-change:transform}
.vh--bg-photo .vh-photo,.vh--bg-photo .vh-aur{display:block}
.vh--bg-photo .vh-pix{display:block;z-index:2}
.vh--bg-photo .vh-glow{display:none}
.vh-photo-img{position:absolute;inset:-5%;background-size:cover;background-position:var(--ppos,center);opacity:0;transition:opacity .5s ease;
-webkit-mask-image:linear-gradient(90deg,transparent 28%,rgba(0,0,0,.55) 46%,#000 64%);mask-image:linear-gradient(90deg,transparent 28%,rgba(0,0,0,.55) 46%,#000 64%)}
.vh-photo-img.is-loaded{opacity:1;animation:vh-kb 28s ease-in-out infinite alternate}
@keyframes vh-kb{from{transform:scale(1.04)}to{transform:scale(1.14) translate(-1.5%,1%)}}
html[data-vtheme="dark"] .vh-photo-img{filter:brightness(.78) saturate(1.1)}
.vh-reveal{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
@media (max-width:980px){
.vh-photo-img{-webkit-mask-image:linear-gradient(180deg,transparent 38%,rgba(0,0,0,.6) 55%,#000 72%);mask-image:linear-gradient(180deg,transparent 38%,rgba(0,0,0,.6) 55%,#000 72%)}
}
@media (prefers-reduced-motion:reduce){ .vh-photo-img.is-loaded{animation:none} }
</style>

<style>

.vk-scan{position:absolute;left:0;right:0;top:0;height:3px;background:var(--sac,var(--ac));box-shadow:0 0 24px 6px color-mix(in srgb,var(--sac,var(--ac)) 55%,transparent);opacity:0;z-index:3;pointer-events:none}

.vk-screen.is-build .s-nav,.vk-screen.is-build .s-tag,.vk-screen.is-build .s-h,.vk-screen.is-build .s-p,.vk-screen.is-build .s-ctas,.vk-screen.is-build .s-feats,.vk-screen.is-build .s-art{
  animation:vk-up .7s cubic-bezier(.2,.8,.2,1) both}
.vk-screen.is-build .s-tag{animation-delay:.08s}.vk-screen.is-build .s-h{animation-delay:.14s}.vk-screen.is-build .s-p{animation-delay:.2s}
.vk-screen.is-build .s-ctas{animation-delay:.26s}.vk-screen.is-build .s-feats{animation-delay:.32s}.vk-screen.is-build .s-art{animation-delay:.12s}
@keyframes vk-up{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

/* конфетти */
.vk-conf{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.vk-conf i{position:absolute;top:-10px;width:9px;height:14px;border-radius:2px;animation:vk-fall linear forwards}
@keyframes vk-fall{to{transform:translate(var(--dx),620px) rotate(var(--r));opacity:0}}

/* появление */
.vk-r{opacity:0;transform:translateY(36px);transition:opacity .9s ease var(--d,0s),transform 1s cubic-bezier(.2,.8,.2,1) var(--d,0s)}
.vk-r.is-in{opacity:1;transform:none}

/* адаптив */
@media (max-width:1080px){
  .vk-work{grid-template-columns:1fr}
  .vk-view{order:-1;min-height:0}
}
@media (max-width:760px){
  .vk{padding:80px 20px}
  .vk-head{grid-template-columns:1fr;gap:20px;margin-bottom:32px}
  .vk-panel{padding:22px 18px}
  .vk-view{padding:16px}
  .vk-view.is-mobile .vk-frame{max-width:280px}
}
@media (prefers-reduced-motion:reduce){
  .vk *{animation:none!important;transition:none!important}
  .vk .vk-r,.vk .vk-wi{opacity:1;transform:none}
}

      return '<button type="button" class="vk-swatch' + (i === state.color ? ' is-on' : '') + '" style="--c:' + s.c + '" data-k="color" data-v="' + i + '" aria-label="' + (s[lang] || s.uk) + '" title="' + (s[lang] || s.uk) + '"></button>';
    }).join('');
    ['niche', 'style', 'color'].forEach(function (k) { q('.vk-grp[data-g=' + k + ']').classList.toggle('is-done', !!touched[k]); });
    renderTimer();
  }

  function renderSite(animate) {
    var T = CONFIG[lang] || CONFIG.uk;
    var nn = CONFIG.niches[state.niche], t = nn[lang] || nn.uk, st = CONFIG.styles[state.style], sw = CONFIG.swatches[state.color];
    site.setAttribute('data-style', st);
    site.style.setProperty('--s-ac', sw.c);
    site.style.setProperty('--s-on', isDark(sw.c) ? '#ffffff' : '#0b0b0d');
    view.style.setProperty('--sac', sw.c);
    root.style.setProperty('--sac', sw.c);
    q('.vk-url').innerHTML = '🔒 ' + nn.domain;
    site.innerHTML =
      '<div class="s-nav"><b class="s-logo">' + nn.logo + '<i>.</i></b>' + t.nav.map(function (x) { return '<span>' + x + '</span>'; }).join('') + '<em>' + t.cta + '</em></div>' +
      '<div class="s-hero"><div><span class="s-tag">' + t.name + '</span><h3 class="s-h">' + t.h + '</h3><p class="s-p">' + t.p + '</p>' +
      '<div class="s-ctas"><span class="s-btn">' + t.cta + ' →</span><span class="s-link">' + T.more + '</span></div>' +
      '<div class="s-feats">' + t.feats.map(function (x) { return '<span>' + x + '</span>'; }).join('') + '</div></div>' +
      '<div class="s-art"><div class="s-blob"></div><span class="s-emoji">' + nn.emoji + '</span><span class="s-chip c1">' + t.c1 + '</span><span class="s-chip c2"><b>●</b> ' + t.c2 + '</span></div></div>';
    q('.vk-sum').innerHTML = T.sum + ' <span style="color:var(--fg)">' + t.name + ' · ' + T.styles[st] + ' · ' + (sw[lang] || sw.uk) + '</span>';
    var msg = T.msg + '\n\n' + T.g1 + ': ' + t.name + '\n' + T.g2 + ': ' + T.styles[st] + '\n' + T.g3 + ': ' + (sw[lang] || sw.uk);
    var cta = q('.vk-cta');
    cta.href = CONFIG.telegram + (CONFIG.telegram.indexOf('?') > -1 ? '&' : '?') + 'text=' + encodeURIComponent(msg);
    cta.onclick = function () { try { navigator.clipboard && navigator.clipboard.writeText(msg); } catch (e) {} };
    if (animate) { screen.classList.remove('is-build'); void screen.offsetWidth; screen.classList.add('is-build'); }
  }

  function renderTimer() {
    var T = CONFIG[lang] || CONFIG.uk, box = q('.vk-timer');
    var sec = tStart ? ((tEnd || performance.now()) - tStart) / 1000 : 0;
    q('.vk-timer-t').textContent = tEnd ? T.timer : T.timerIdle;
    box.querySelector('b').textContent = dec(sec) + ' ' + T.sec;
    box.classList.toggle('is-done', !!tEnd);
  }
  function tickTimer() { renderTimer(); if (tStart && !tEnd) timerRaf = requestAnimationFrame(tickTimer); }

  function confetti() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var box = q('.vk-conf'), cols = [CONFIG.swatches[state.color].c, '#ffffff', (getComputedStyle(root).getPropertyValue('--ac').trim() || '#6a3dff'), '#ff6ec7'];
    var html = '';
    for (var i = 0; i < 46; i++) {
      html += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;background:' + cols[i % cols.length] + ';--dx:' + ((Math.random() - 0.5) * 160).toFixed(0) + 'px;--r:' + ((Math.random() - 0.5) * 900).toFixed(0) + 'deg;animation-duration:' + (1.4 + Math.random() * 1.3).toFixed(2) + 's;animation-delay:' + (Math.random() * 0.3).toFixed(2) + 's"></i>';
    }
    box.innerHTML = html;
    setTimeout(function () { box.innerHTML = ''; }, 3200);
  }

  function choose(k, v, fromDice) {
    state[k] = v;
    if (!fromDice) {
      if (!tStart) { tStart = performance.now(); tickTimer(); }
      touched[k] = true;
      if (!tEnd && touched.niche && touched.style && touched.color) { tEnd = performance.now(); renderTimer(); confetti(); }
    }
    renderControls(); renderSite(true);
  }

  root.addEventListener('click', function (e) {
    var b = e.target.closest('[data-k]');
    if (b) { choose(b.getAttribute('data-k'), +b.getAttribute('data-v')); return; }
    if (e.target.closest('.vk-dice')) {
      state.niche = Math.floor(Math.random() * CONFIG.niches.length);
      state.style = Math.floor(Math.random() * CONFIG.styles.length);
      state.color = Math.floor(Math.random() * CONFIG.swatches.length);
      renderControls(); renderSite(true); return;
    }
    var d = e.target.closest('.vk-dev');
    if (d) {
      root.querySelectorAll('.vk-dev').forEach(function (x) { x.classList.toggle('is-on', x === d); });
      view.classList.toggle('is-mobile', d.getAttribute('data-dev') === 'mobile');
      setTimeout(function () { renderSite(true); }, 350);
    }
  });

  window.addEventListener('vlad:lang', function (e) {
    lang = e.detail; renderControls(); renderSite(false);
    root.querySelectorAll('.vk-r, .vk-title').forEach(function (el) { el.classList.add('is-in'); });
  });

  renderControls(); renderSite(false);

  // появление при прокрутке
  var reveal = [].slice.call(root.querySelectorAll('.vk-r, .vk-title'));
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (en) {
      en.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); if (e.target.classList.contains('vk-view')) renderSite(true); } });
    }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
    reveal.forEach(function (el) { io.observe(el); });
  } else {
    reveal.forEach(function (el) { el.classList.add('is-in'); });
  }
})();
</script>

<style>
html,body{margin:0}
/* ===== ЦВЕТА ← ИЗМЕНИТЬ: светлая тема (по умолчанию) и тёмная ===== */
.vw{--bg:#faf9f7;--fg:#15121f;--muted:#6b6779;--ac:#6a3dff;--ac2:#ff6ec7;--ink:#ffffff;--line:rgba(21,18,31,.09);--card:#ffffff;--soft:rgba(21,18,31,.03);--soft2:rgba(21,18,31,.05);--bd:rgba(21,18,31,.14);--bd2:rgba(21,18,31,.26);--chrome:#efedf3;--chrome2:#e2dfea;--dot:#cdc9d8;--frame:#f4f2f8;--view:#f1eff6;--shadow:rgba(40,25,90,.18)}

  var root = document.getElementById('works');

  function demoPage(d) {
    return '<div class="wf" style="--pbg:' + d.bg + ';--pfg:' + d.fg + ';--pac:' + d.ac + ';--pcard:' + d.card + ';--pimg:' + d.img + ';--pimg2:' + d.img2 + '">' +

  function applyFilter(anim) {

  q('.vw-filter').addEventListener('click', function (e) {

  // ---------- раскладка: горизонтально (компьютер) или сеткой (телефон) ----------
  var pin = q('.vw-pin'), sticky = q('.vw-sticky'), rail = q('.vw-rail');

  }

    q('.vw-hud-num').innerHTML = '<b>' + pad(idx) + '</b> / ' + pad(vis.length);
    if (!running) { running = true; requestAnimationFrame(loop); }
  }
  function loop() {
    curX += (tgtX - curX) * 0.12;
    if (Math.abs(tgtX - curX) < 0.3) curX = tgtX;

    if (curX !== tgtX) requestAnimationFrame(loop); else running = false;
  }
  window.addEventListener('scroll', function () { onScroll(false); }, { passive: true });

  var cur = q('.vw-cursor'), cx = -200, cy = -200, x = -200, y = -200, s = 0, ts = 0, crun = false;

  } else {

  }
})();

/* ===== ЦВЕТА ← ИЗМЕНИТЬ: светлая тема (по умолчанию) и тёмная ===== */
.va{--bg:#faf9f7;--fg:#15121f;--muted:#6b6779;--ac:#6a3dff;--ac2:#ff6ec7;--ink:#ffffff;--line:rgba(21,18,31,.09);--card:#ffffff;--soft:rgba(21,18,31,.03);--soft2:rgba(21,18,31,.05);--bd:rgba(21,18,31,.14);--bd2:rgba(21,18,31,.26);--chrome:#efedf3;--chrome2:#e2dfea;--dot:#cdc9d8;--frame:#f4f2f8;--view:#f1eff6;--shadow:rgba(40,25,90,.18)}
html[data-vtheme="dark"] .va{--bg:#0e0b16;--fg:#f1eeff;--muted:#a19cb3;--ac:#8f6bff;--ac2:#ff7ad0;--ink:#ffffff;--line:rgba(241,238,255,.08);--card:#17131f;--soft:rgba(241,238,255,.03);--soft2:rgba(241,238,255,.06);--bd:rgba(241,238,255,.16);--bd2:rgba(241,238,255,.28);--chrome:#1f1a2a;--chrome2:#2a2438;--dot:#3a3348;--frame:#1a1624;--view:#120f1b;--shadow:rgba(0,0,0,.65)}

.va{
  position:relative;background:var(--bg);color:var(--fg);font-family:'Manrope',system-ui,sans-serif;overflow:hidden;isolation:isolate;
  padding:120px 40px;-webkit-font-smoothing:antialiased}
.va *,.va *::before,.va *::after{box-sizing:border-box;margin:0;padding:0}
.va a{color:inherit;text-decoration:none}
.va ul{list-style:none}
.va-inner{max-width:1320px;margin:0 auto}

/* шапка */
.va-head{display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:end;margin-bottom:56px}
.va-label{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.va-label::before{content:'';width:28px;height:1px;background:var(--ac)}
.va-title{margin-top:22px;font-family:'Unbounded',sans-serif;font-weight:800;font-size:clamp(30px,4vw,58px);line-height:1.06;letter-spacing:-.035em}
.va-w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em;margin-bottom:-.1em}
.va-wi{display:inline-block;transform:translateY(110%);transition:transform 1s cubic-bezier(.2,.8,.2,1) var(--d,0s)}
.va-title.is-in .va-wi{transform:none}
.va-acc{color:var(--ac)}
.va-lead{max-width:440px;font-size:clamp(16px,1.2vw,18px);line-height:1.6;color:var(--muted)}

/* бенто-сетка */
.va-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.va-box{position:relative;border-radius:24px;background:var(--card);border:1px solid var(--line)}
.va-box::before{content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;opacity:0;transition:opacity .4s;
  background:radial-gradient(380px circle at var(--x,50%) var(--y,50%),var(--ac),transparent 45%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.va-grid:hover .va-box::before{opacity:1}
.va-box>*{position:relative;z-index:1}

/* карточка «обо мне» */
.va-me{grid-column:span 7;display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:center;padding:36px}
.va-photo{position:relative;width:220px;height:220px}
.va-blob{position:absolute;inset:18px;overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--ac) 80%,#fff),var(--ac) 40%,color-mix(in srgb,var(--ac) 45%,var(--ink)));
  border-radius:58% 42% 51% 49% / 46% 55% 45% 54%;animation:va-morph 9s ease-in-out infinite}
.va-blob img{width:100%;height:100%;object-fit:cover;display:block}
.va-initial{font-family:'Unbounded',sans-serif;font-weight:800;font-size:84px;color:var(--ink);letter-spacing:-.05em}
@keyframes va-morph{
  0%,100%{border-radius:58% 42% 51% 49% / 46% 55% 45% 54%}
  33%{border-radius:42% 58% 62% 38% / 55% 41% 59% 45%}
  66%{border-radius:50% 50% 38% 62% / 39% 60% 40% 61%}}
.va-ring{position:absolute;inset:0;width:100%;height:100%;animation:va-spin 18s linear infinite;color:var(--muted)}
@keyframes va-spin{to{transform:rotate(360deg)}}
.va-hand{position:absolute;right:6px;bottom:18px;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:22px;
  box-shadow:0 10px 24px -8px var(--shadow);transform-origin:70% 70%}
.va-me:hover .va-hand{animation:va-wave 1.2s ease-in-out}
@keyframes va-wave{0%,100%{transform:rotate(0)}20%{transform:rotate(16deg)}40%{transform:rotate(-10deg)}60%{transform:rotate(14deg)}80%{transform:rotate(-6deg)}}

.va-hi{font-size:14px;font-weight:600;color:var(--ac)}
.va-name{margin-top:6px;font-family:'Unbounded',sans-serif;font-weight:800;font-size:clamp(28px,2.6vw,40px);letter-spacing:-.035em;line-height:1.05}
.va-role{margin-top:6px;font-size:15px;font-weight:500;color:var(--muted)}
.va-bio{margin-top:18px;font-size:16px;line-height:1.65;color:var(--fg);opacity:.86}
.va-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.va-tools span{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--soft);font-size:12.5px;font-weight:600;transition:background .25s,color .25s,border-color .25s}
.va-tools span:hover{background:var(--ac);color:var(--ink);border-color:var(--ac)}

/* счётчики */
.va-stats{grid-column:span 5;display:grid;grid-template-columns:1fr 1fr;padding:0;overflow:hidden}
.va-stat{display:flex;flex-direction:column;justify-content:space-between;gap:18px;padding:28px;min-height:170px}
.va-stat:nth-child(odd){border-right:1px solid var(--line)}
.va-stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
.va-val{font-family:'Unbounded',sans-serif;font-weight:800;font-size:clamp(38px,3.6vw,56px);letter-spacing:-.05em;line-height:1}
.va-val i{font-style:normal;color:var(--ac)}
.va-stat-label{font-size:14px;line-height:1.45;color:var(--muted)}

/* преимущества */
.va-adv{grid-column:span 4;padding:28px;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.va-adv:hover{transform:translateY(-5px)}
.va-ico{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--ac);
  transition:transform .6s cubic-bezier(.2,.8,.2,1),background .3s,color .3s}
.va-ico svg{width:24px;height:24px}
.va-adv:hover .va-ico{transform:rotate(-12deg) scale(1.08);background:var(--ac);color:var(--ink)}
.va-adv h3{margin-top:22px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:18px;letter-spacing:-.02em;line-height:1.25}
.va-adv p{margin-top:10px;font-size:15px;line-height:1.6;color:var(--muted)}

/* появление */
.va-r{opacity:0;transform:translateY(36px);transition:opacity .9s ease var(--d,0s),transform 1s cubic-bezier(.2,.8,.2,1) var(--d,0s)}
.va-r.is-in{opacity:1;transform:none}
.va-adv.va-r.is-in:hover{transform:translateY(-5px)}

/* адаптив */
@media (max-width:1100px){
  .va-me,.va-stats{grid-column:1/-1}
  .va-stats{grid-template-columns:repeat(4,1fr)}
  .va-stat:nth-child(odd){border-right:0}
  .va-stat:nth-child(-n+2){border-bottom:0}
  .va-stat+.va-stat{border-left:1px solid var(--line)}
  .va-adv{grid-column:span 6}
}
@media (max-width:760px){
  .va{padding:80px 20px}
  .va-head{grid-template-columns:1fr;gap:20px;margin-bottom:36px}
  .va-me{grid-template-columns:1fr;gap:20px;padding:24px}
  .va-photo{width:180px;height:180px}
  .va-initial{font-size:68px}
  .va-stats{grid-template-columns:1fr 1fr}
  .va-stat{padding:22px;min-height:140px}
  .va-stat+.va-stat{border-left:0}
  .va-stat:nth-child(odd){border-right:1px solid var(--line)}
  .va-stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .va-adv{grid-column:1/-1;padding:24px}
}
@media (prefers-reduced-motion:reduce){
  .va *{animation:none!important;transition:none!important}
  .va .va-r,.va .va-wi{opacity:1;transform:none}
}
</style>

(function () {
  /* =================================================================
     CONFIG — ВСЁ, ЧТО МОЖНО МЕНЯТЬ, НАХОДИТСЯ ЗДЕСЬ
     Тексты — в двух языках: uk и en. Цвета — в начале <style>.
     ================================================================= */
  var CONFIG = {
    photo: '',                                       // ← ИЗМЕНИТЬ: ссылка на твоё фото (квадратное). Пусто — буква в фигуре
    tools: ['Tilda', 'HTML / CSS / JS', 'GitHub Pages', 'Netlify'],  // ← ИЗМЕНИТЬ: общие для обоих языков инструменты
    /* Счётчики: value — число (докручивается), suffix — после числа. Подписи — в uk / en. */
    stats: [ { value: 1, suffix: '' }, { value: 100, suffix: '%' }, { value: 0, suffix: '' }, { value: 24, suffix: '/7' } ],
    icons: ['person', 'brand', 'phone', 'edit', 'speed', 'steps'],   // иконки преимуществ по порядку

    uk: {                                                                         // ← ИЗМЕНИТЬ
      label: 'Про мене', title: 'Чому обирають', titleAccent: 'мене',
      lead: 'Не студія з менеджерами й не шаблон за вечір. Одна людина, яка відповідає за ваш сайт від ідеї до запуску.',
      initial: 'В', ring: 'ВЕБ-РОЗРОБНИК • ЛЕНДИНГИ • САЙТИ • МАГАЗИНИ • ',
      hi: 'Привіт, я', name: 'Влад', role: 'Веб-розробник',
      bio: 'Роблю сайти для малого бізнесу й брендів — від лендингів до інтернет-магазинів. Мені важливо, щоб сайт не просто гарно виглядав, а приводив клієнтів і ним було зручно користуватися з телефона.',
      tools: ['Анімації', 'Адаптив'],
      stats: ['людина на весь проєкт — без менеджерів і посередників', 'сайтів адаптовано під телефон', 'готових шаблонів — дизайн під ваш бренд', 'ваш сайт приймає заявки'],

        { title: 'Дизайн під бренд', text: 'Унікальний перший екран і стиль під вашу нішу, а не шаблон, як у всіх.' },
        { title: 'Ідеально на телефоні', text: 'Більшість клієнтів зайдуть зі смартфона — перевіряю кожен блок на мобільному.' },

        { title: 'Швидке завантаження', text: 'Стиснуті фото й відео, легкий код — сайт відкривається швидко навіть із мобільного інтернету.' },

    },

      label: 'About', title: 'Why clients', titleAccent: 'choose me',
      lead: 'Not an agency with managers and not a template thrown together overnight. One person responsible for your website from idea to launch.',
      initial: 'V', ring: 'WEB DEVELOPER • LANDING PAGES • WEBSITES • STORES • ',
      hi: 'Hi, I’m', name: 'Vlad', role: 'Web developer',
      bio: 'I build websites for small businesses and brands — from landing pages to online stores. I care that a site doesn’t just look good, but brings in clients and is easy to use on a phone.',
      tools: ['Animations', 'Responsive'],
      stats: ['person on the whole project — no managers or middlemen', 'of my sites are fully responsive', 'ready-made templates — design built for your brand', 'your site collects leads'],
      advantages: [
        { title: 'Work with me directly', text: 'No managers, no broken telephone. Quick replies on Telegram.' },
        { title: 'Design for your brand', text: 'A unique first screen and style for your niche — not the same template as everyone else.' },
        { title: 'Perfect on mobile', text: 'Most of your clients will come from a phone, so I test every block on mobile.' },

        { title: 'Fast loading', text: 'Compressed images and video, lightweight code — the site opens fast even on mobile data.' },
        { title: 'Clear timelines', text: 'I work in stages: you always know what’s done and what’s next.' }
      ]
    }
  };
  /* ======================= дальше можно не трогать ======================= */

  var VL = window.VLAD_I18N || (window.VLAD_I18N = (function () {
    function detect() {
      try {
        var u = new URLSearchParams(location.search).get('lang');
        if (u === 'uk' || u === 'en') { localStorage.setItem('vlad-lang', u); return u; }
        var s = localStorage.getItem('vlad-lang'); if (s === 'uk' || s === 'en') return s;
      } catch (e) {}
      var nl = (navigator.language || '').toLowerCase();
      return (nl.indexOf('uk') === 0 || nl.indexOf('ru') === 0) ? 'uk' : 'en';
    }
    var api = { lang: detect() };
    document.documentElement.lang = api.lang;
    api.set = function (l) {
      if (l === api.lang) return;
      api.lang = l; document.documentElement.lang = l;
      try { localStorage.setItem('vlad-lang', l); } catch (e) {}
      try { var url = new URL(location.href); if (l === 'en') url.searchParams.set('lang', 'en'); else url.searchParams.delete('lang'); history.replaceState(null, '', url); } catch (e) {}
      window.dispatchEvent(new CustomEvent('vlad:lang', { detail: l }));
    };
    return api;
  })());

  if (!root) return;
  var q = function (s) { return root.querySelector(s); };
  var lang = VL.lang, counted = false;

  var ICONS = {

  function render() {

    q('.va-label').textContent = T.label;
    q('.va-lead').textContent = T.lead;
    var html = '', n = 0;
    function addWords(text, cls) {
      text.split(' ').forEach(function (w) {
        if (!w) return;
        html += '<span class="va-w"><span class="va-wi' + (cls ? ' ' + cls : '') + '" style="--d:' + (n * 0.08).toFixed(2) + 's">' + w + '</span></span> ';

    q('.va-title').innerHTML = html;

    var tools = CONFIG.tools.slice(0, 2).concat(T.tools, CONFIG.tools.slice(2));
    var me = '<div class="va-box va-me va-r">' +
      '<div class="va-photo">' +

})();

html[data-vtheme="dark"] .vc{--bg:#0e0b16;--fg:#f1eeff;--muted:#a19cb3;--ac:#8f6bff;--ac2:#ff7ad0;--ink:#ffffff;--line:rgba(241,238,255,.08);--card:#17131f;--soft:rgba(241,238,255,.03);--soft2:rgba(241,238,255,.06);--bd:rgba(241,238,255,.16);--bd2:rgba(241,238,255,.28);--chrome:#1f1a2a;--chrome2:#2a2438;--dot:#3a3348;--frame:#1a1624;--view:#120f1b;--shadow:rgba(0,0,0,.65)}

.vc{
  position:relative;background:var(--bg);color:var(--fg);font-family:'Manrope',system-ui,sans-serif;overflow:hidden;isolation:isolate;
  padding:120px 40px;-webkit-font-smoothing:antialiased}
.vc *,.vc *::before,.vc *::after{box-sizing:border-box;margin:0;padding:0}
:where(.vc) a{color:inherit;text-decoration:none}
.vc ul{list-style:none}
:where(.vc) button,:where(.vc) input{font:inherit;color:inherit}
.vc-inner{max-width:1320px;margin:0 auto}

/* шапка */
.vc-head{display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:end;margin-bottom:56px}
.vc-label{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.vc-label::before{content:'';width:28px;height:1px;background:var(--ac)}
.vc-title{margin-top:22px;font-family:'Unbounded',sans-serif;font-weight:800;font-size:clamp(30px,4vw,58px);line-height:1.06;letter-spacing:-.035em}
.vc-w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em;margin-bottom:-.1em}
.vc-wi{display:inline-block;transform:translateY(110%);transition:transform 1s cubic-bezier(.2,.8,.2,1) var(--d,0s)}
.vc-title.is-in .vc-wi{transform:none}
.vc-acc{color:var(--ac)}
.vc-lead{max-width:440px;font-size:clamp(16px,1.2vw,18px);line-height:1.6;color:var(--muted)}

/* пакеты */
.vc-plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:stretch}
.vc-plan{position:relative;display:flex;flex-direction:column;padding:32px 30px 30px;border-radius:28px;background:var(--card);border:1px solid var(--line);
  transition:transform .5s cubic-bezier(.2,.8,.2,1),border-color .3s}
.vc-plan:hover{transform:translateY(-6px);border-color:var(--bd)}
.vc-plan.is-hot{background:var(--ac);color:var(--ink);border-color:var(--ac)}
.vc-plan.is-hot:hover{border-color:var(--ac)}
.vc-plan-name{font-family:'Unbounded',sans-serif;font-weight:700;font-size:24px;letter-spacing:-.025em}
.vc-plan-for{margin-top:8px;font-size:14px;line-height:1.5;color:var(--muted);max-width:90%}
.vc-plan.is-hot .vc-plan-for{color:rgba(255,255,255,.82)}
.vc-price{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
.vc-plan.is-hot .vc-price{border-color:rgba(255,255,255,.28)}
.vc-from{font-size:15px;font-weight:600;color:var(--muted)}
.vc-plan.is-hot .vc-from{color:rgba(255,255,255,.75)}
.vc-sum{font-family:'Unbounded',sans-serif;font-weight:800;font-size:clamp(34px,3.2vw,46px);letter-spacing:-.045em;line-height:1}
.vc-sum.is-ask{font-size:clamp(24px,2.2vw,30px)}
.vc-time{width:100%;margin-top:8px;font-size:14px;font-weight:500;color:var(--muted)}
.vc-plan.is-hot .vc-time{color:rgba(255,255,255,.78)}
.vc-scope{margin-top:22px;padding:12px 14px;border-radius:14px;background:var(--soft2);font-size:14px;font-weight:600;line-height:1.45}
.vc-plan.is-hot .vc-scope{background:rgba(255,255,255,.14)}
.vc-feat{display:grid;gap:12px;margin:22px 0 28px}
.vc-feat li{display:flex;align-items:flex-start;gap:10px;font-size:15px;line-height:1.4;font-weight:500}
.vc-feat svg{flex:none;width:20px;height:20px;padding:4px;border-radius:50%;margin-top:-1px}
.vc-feat .yes svg{color:var(--ac);background:color-mix(in srgb,var(--ac) 15%,transparent)}
.vc-plan.is-hot .vc-feat .yes svg{color:var(--ac);background:var(--ink)}
.vc-feat .no{color:var(--muted);opacity:.55;text-decoration:line-through;text-decoration-color:rgba(155,155,151,.5)}
.vc-feat .no svg{color:var(--muted);background:var(--soft2)}
.vc-plan.is-hot .vc-feat .no{color:rgba(255,255,255,.62)}
.vc-plan.is-hot .vc-feat .no svg{color:rgba(255,255,255,.62);background:rgba(255,255,255,.12)}
.vc-pick{margin-top:auto;display:flex;align-items:center;justify-content:space-between;height:58px;padding:0 8px 0 24px;border-radius:999px;cursor:pointer;
  border:1px solid var(--bd);background:none;font-size:15px;font-weight:700;transition:background .3s,color .3s,border-color .3s}
.vc-pick:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.vc-plan.is-hot .vc-pick{background:#ffffff;color:var(--ac);border-color:var(--ink)}
.vc-plan.is-hot .vc-pick:hover{background:#f1eeff}
.vc-pick-ico{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--ac);color:var(--ink);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.vc-pick:hover .vc-pick-ico{transform:rotate(-45deg)}

/* стикер «популярный» */
.vc-sticker{position:absolute;right:-14px;top:-26px;width:104px;height:104px;border-radius:50%;background:var(--ink);color:var(--ac);display:grid;place-items:center;z-index:2;
  box-shadow:0 14px 30px -10px var(--shadow)}
.vc-sticker svg.vc-sring{position:absolute;inset:0;width:100%;height:100%;animation:vc-spin 12s linear infinite}
.vc-sticker b{font-size:26px}
@keyframes vc-spin{to{transform:rotate(360deg)}}
.vc-note{margin-top:22px;text-align:center;font-size:14px;color:var(--muted)}

/* квиз */
.vc-quiz{display:grid;grid-template-columns:.8fr 1.2fr;gap:0;margin-top:72px;border-radius:28px;border:1px solid var(--line);background:var(--card);overflow:hidden;scroll-margin-top:40px}
.vc-qside{position:relative;padding:40px;border-right:1px solid var(--line);
  background:radial-gradient(circle at 0% 100%,color-mix(in srgb,var(--ac) 14%,transparent),transparent 60%)}
.vc-qtag{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.vc-qtitle{margin-top:20px;font-family:'Unbounded',sans-serif;font-weight:800;font-size:clamp(24px,2.4vw,36px);letter-spacing:-.035em;line-height:1.1}
.vc-qtext{margin-top:14px;font-size:15px;line-height:1.6;color:var(--muted);max-width:360px}
.vc-dots{display:flex;gap:8px;margin-top:36px}
.vc-dots i{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
.vc-dots i::after{content:'';position:absolute;inset:0;background:var(--ac);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.vc-dots i.on::after{transform:scaleX(1)}
.vc-stepnum{margin-top:12px;font-size:13px;font-weight:600;color:var(--muted)}

.vc-qmain{position:relative;padding:40px;min-height:420px}
.vc-qs{display:none;animation:vc-in .5s cubic-bezier(.2,.8,.2,1)}
.vc-qs.is-on{display:block}
@keyframes vc-in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.vc-qq{font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(19px,1.6vw,24px);letter-spacing:-.02em;line-height:1.25}
.vc-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
.vc-opt{position:relative;display:flex;align-items:center;gap:12px;min-height:64px;padding:14px 18px;border-radius:16px;border:1px solid var(--line);background:var(--soft);
  text-align:left;font-size:15px;font-weight:600;cursor:pointer;transition:border-color .25s,background .25s,transform .25s}
.vc-opt:hover{border-color:var(--bd2);transform:translateY(-2px)}
.vc-opt::before{content:'';flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--bd2);transition:border .2s,background .2s}
.vc-opt.is-sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 8%,transparent)}
.vc-opt.is-sel::before{border:5px solid var(--ac);background:var(--ink)}
.vc-fields{display:grid;gap:12px;margin-top:24px}
.vc-field{display:block}
.vc-field span{display:block;margin-bottom:8px;font-size:13px;font-weight:600;color:var(--muted)}
.vc-field input{width:100%;height:56px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--soft);font-size:16px;outline:none;transition:border-color .25s,background .25s}
.vc-field input:focus{border-color:var(--ac);background:var(--soft2)}
.vc-field input.is-err{border-color:#ff6b6b}
.vc-qnav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:28px}
.vc-back{display:inline-flex;align-items:center;gap:8px;padding:10px 4px;border:0;background:none;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;transition:color .2s}
.vc-back:hover{color:var(--fg)}
.vc-back[hidden]{display:none}
.vc-next{display:inline-flex;align-items:center;gap:12px;height:56px;padding:0 8px 0 24px;border:0;border-radius:999px;background:var(--ac);color:var(--ink);font-size:15px;font-weight:700;cursor:pointer;transition:opacity .2s,transform .3s}
.vc-next:hover{transform:translateY(-2px)}
.vc-next:disabled{opacity:.35;cursor:not-allowed;transform:none}
.vc-next-ico{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--ac)}

.vc-done-ico{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--ac);color:var(--ink);animation:vc-pop .6s cubic-bezier(.2,1.6,.4,1)}
.vc-done-ico svg{width:30px;height:30px}
@keyframes vc-pop{from{transform:scale(0)}to{transform:scale(1)}}
.vc-done h3{margin-top:20px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(20px,1.8vw,26px);letter-spacing:-.02em}
.vc-done p{margin-top:10px;font-size:15px;line-height:1.6;color:var(--muted)}
.vc-sumbox{margin-top:20px;padding:18px 20px;border-radius:16px;border:1px dashed var(--bd);background:var(--soft);
  font-size:14px;line-height:1.7;white-space:pre-line}
.vc-est{margin-top:14px;font-size:15px;font-weight:600}
.vc-est b{font-family:'Unbounded',sans-serif;color:var(--ac)}
.vc-done-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.vc-copy{display:inline-flex;align-items:center;gap:8px;height:56px;padding:0 22px;border-radius:999px;border:1px solid var(--bd);background:none;font-size:15px;font-weight:700;cursor:pointer;transition:background .25s,color .25s}
.vc-copy:hover{background:var(--fg);color:var(--bg)}

/* появление */
.vc-r{opacity:0;transform:translateY(36px);transition:opacity .9s ease var(--d,0s),transform 1s cubic-bezier(.2,.8,.2,1) var(--d,0s)}
.vc-r.is-in{opacity:1;transform:none}
.vc-plan.vc-r.is-in:hover{transform:translateY(-6px)}

/* адаптив */
@media (max-width:1080px){
  .vc-plans{grid-template-columns:1fr 1fr}
  .vc-plans .vc-plan:last-child{grid-column:1/-1}
  .vc-quiz{grid-template-columns:1fr}
  .vc-qside{border-right:0;border-bottom:1px solid var(--line)}
}
@media (max-width:760px){
  .vc{padding:80px 20px}
  .vc-head{grid-template-columns:1fr;gap:20px;margin-bottom:40px}
  .vc-plans{grid-template-columns:1fr;gap:28px}
  .vc-plan{padding:28px 22px 22px}
  .vc-sticker{right:-4px;top:-22px;width:86px;height:86px}
  .vc-quiz{margin-top:56px}
  .vc-qside,.vc-qmain{padding:26px 22px}
  .vc-qmain{min-height:0}
  .vc-opts{grid-template-columns:1fr}
  .vc-next{flex:1;justify-content:space-between}
}
@media (prefers-reduced-motion:reduce){
  .vc *{animation:none!important;transition:none!important}
  .vc .vc-r,.vc .vc-wi{opacity:1;transform:none}
}

  var yes = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var no = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>';
  var arrow = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  function fmt(p) { return String(p).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }

  // состояние квиза хранится индексами — переживает смену языка
  var ans = {}, plan = -1, step = 0, sent = false, nameV = '', contV = '';
  var NQ = CONFIG.uk.quiz.questions.length, total = NQ + 1;

  function T() { return CONFIG[lang] || CONFIG.uk; }

  function renderHead() {
    var t = T();
    q('.vc-label').textContent = t.label;
    q('.vc-lead').textContent = t.lead;
    q('.vc-note').textContent = t.note;
    var html = '', n = 0;
    function addWords(text, cls) {
      text.split(' ').forEach(function (w) {
        if (!w) return;
        html += '<span class="vc-w"><span class="vc-wi' + (cls ? ' ' + cls : '') + '" style="--d:' + (n * 0.08).toFixed(2) + 's">' + w + '</span></span> ';
        n++;
      });
    }
    addWords(t.title, ''); addWords(t.titleAccent, 'vc-acc');
    q('.vc-title').innerHTML = html;

    q('.vc-plans').innerHTML = CONFIG.plans.map(function (p, i) {
      var tp = t.plans[i];
      var sticker = p.hot ? '<span class="vc-sticker" aria-hidden="true"><svg class="vc-sring" viewBox="0 0 100 100"><defs><path id="vcCircle' + i + '" d="M50,50 m-37,0 a37,37 0 1,1 74,0 a37,37 0 1,1 -74,0"/></defs><text font-family="Manrope, sans-serif" font-size="9" font-weight="800" fill="currentColor"><textPath href="#vcCircle' + i + '" textLength="230" lengthAdjust="spacing">' + t.sticker + '</textPath></text></svg><b>★</b></span>' : '';
      var price = p.price
        ? '<span class="vc-from">' + t.priceFrom + '</span><span class="vc-sum">' + fmt(p.price) + ' ' + CONFIG.currency + '</span>'
        : '<span class="vc-sum is-ask">' + t.askText + '</span>';
      return '<article class="vc-plan vc-r' + (p.hot ? ' is-hot' : '') + '" style="--d:' + (0.1 * i).toFixed(2) + 's">' + sticker +
        '<h3 class="vc-plan-name">' + tp.name + '</h3><p class="vc-plan-for">' + tp.for + '</p>' +
        '<div class="vc-price">' + price + (tp.time ? '<span class="vc-time">' + t.timeLabel + ' ' + tp.time + '</span>' : '') + '</div>' +
        '<p class="vc-scope">' + tp.scope + '</p>' +
        '<ul class="vc-feat">' + t.features.map(function (f, k) {
          var ok = CONFIG.featureIn[k] && CONFIG.featureIn[k][i]; return '<li class="' + (ok ? 'yes' : 'no') + '">' + (ok ? yes : no) + f + '</li>';
        }).join('') + '</ul>' +
        '<button type="button" class="vc-pick" data-plan="' + i + '">' + t.pick + '<span class="vc-pick-ico">' + arrow + '</span></button>' +
        '</article>';
    }).join('');
  }

  var main = q('.vc-qmain');
  function renderQuiz() {
    var Q = T().quiz;
    q('.vc-qtag').textContent = Q.tag;
    q('.vc-qtitle').textContent = Q.title;
    q('.vc-qtext').textContent = Q.text;
    q('.vc-dots').innerHTML = new Array(total + 1).join('<i></i>');
    var html = Q.questions.map(function (qq, i) {
      return '<div class="vc-qs" data-step="' + i + '"><p class="vc-qq">' + qq.q + '</p><div class="vc-opts">' +
        qq.opts.map(function (o, k) { return '<button type="button" class="vc-opt' + (ans[i] === k ? ' is-sel' : '') + '" data-q="' + i + '" data-k="' + k + '">' + o + '</button>'; }).join('') + '</div></div>';
    }).join('');
    html += '<div class="vc-qs" data-step="' + NQ + '"><p class="vc-qq">' + Q.contactQ + '</p><div class="vc-fields">' +
      '<label class="vc-field"><span>' + Q.nameLabel + '</span><input type="text" name="name" autocomplete="name"></label>' +
      '<label class="vc-field"><span>' + Q.contactLabel + '</span><input type="text" name="contact" autocomplete="tel" placeholder="' + Q.placeholder + '"></label></div></div>';
    html += '<div class="vc-qs vc-done" data-step="done"><span class="vc-done-ico">' + yes + '</span><h3>' + Q.doneTitle + '</h3><p>' + Q.doneText + '</p>' +
      '<div class="vc-sumbox"></div><p class="vc-est" hidden></p><div class="vc-done-btns">' +
      '<a class="vc-next vc-send" target="_blank" rel="noopener">' + Q.send + '<span class="vc-next-ico">' + arrow + '</span></a>' +
      '<button type="button" class="vc-copy">' + Q.copy + '</button></div></div>';
    html += '<div class="vc-qnav"><button type="button" class="vc-back">← ' + Q.back + '</button><button type="button" class="vc-next vc-go"><span class="vc-go-t"></span><span class="vc-next-ico">' + arrow + '</span></button></div>';
    main.innerHTML = html;
    var ni = main.querySelector('input[name=name]'), ci = main.querySelector('input[name=contact]');
    ni.value = nameV; ci.value = contV;
    ni.addEventListener('input', function () { nameV = ni.value; });
    ci.addEventListener('input', function () { contV = ci.value; ci.classList.remove('is-err'); main.querySelector('.vc-go').disabled = !canGo(); });
    main.querySelector('.vc-back').addEventListener('click', function () { if (step > 0) { step--; show(); } });
    main.querySelector('.vc-go').addEventListener('click', function () {
      if (!canGo()) { if (step === total - 1) ci.classList.add('is-err'); return; }
      if (step < total - 1) { step++; show(); return; }
      finish();
    });
    if (sent) finish(); else show();
  }

  function canGo() { return step < NQ ? ans[step] !== undefined : contV.trim().length > 2; }

  function show() {
    var Q = T().quiz;
    main.querySelectorAll('.vc-qs').forEach(function (p) { p.classList.remove('is-on'); });
    var done = step >= total;
    var pane = done ? main.querySelector('[data-step=done]') : main.querySelector('[data-step="' + step + '"]');
    pane.classList.add('is-on');
    root.querySelectorAll('.vc-dots i').forEach(function (d, i) { d.classList.toggle('on', done || i <= step); });
    q('.vc-stepnum').textContent = done ? '✓' : (step + 1) + ' / ' + total;
    main.querySelector('.vc-qnav').style.display = done ? 'none' : '';
    main.querySelector('.vc-back').hidden = step === 0;
    main.querySelector('.vc-go-t').textContent = step === total - 1 ? Q.submit : Q.next;
    main.querySelector('.vc-go').disabled = !canGo();
  }

  main.addEventListener('click', function (e) {
    var o = e.target.closest('.vc-opt'); if (!o) return;
    var qi = +o.getAttribute('data-q'), k = +o.getAttribute('data-k');
    o.parentNode.querySelectorAll('.vc-opt').forEach(function (b) { b.classList.toggle('is-sel', b === o); });
    ans[qi] = k;
    if (qi === 0) plan = k < 3 ? k : -1;
    main.querySelector('.vc-go').disabled = false;
    setTimeout(function () { if (step === qi && step < total - 1) { step++; show(); } }, 380);
  });

  function buildMessage() {
    var t = T(), Q = t.quiz, lines = [Q.msgTitle, ''];
    Q.questions.forEach(function (qq, i) { lines.push(qq.q.replace(/\?$/, '') + ': ' + (ans[i] !== undefined ? qq.opts[ans[i]] : '—')); });
    if (plan > -1) lines.push(Q.planLabel + ': ' + t.plans[plan].name);
    lines.push('');
    if (nameV.trim()) lines.push(Q.nameMsg + ': ' + nameV.trim());
    lines.push(Q.contactMsg + ': ' + contV.trim());
    return lines.join('\n');
  }
  function copy(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).catch(function () { legacy(text); });
    legacy(text); return Promise.resolve();
  }
  function legacy(text) {
    var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta);
  }
  function finish() {
    var t = T(), Q = t.quiz, msg = buildMessage();
    sent = true;
    main.querySelector('.vc-sumbox').textContent = msg;
    var estEl = main.querySelector('.vc-est'), p = plan > -1 ? CONFIG.plans[plan] : null;
    if (p && p.price) { estEl.hidden = false; estEl.innerHTML = Q.estimate + ' <b>' + t.priceFrom + ' ' + fmt(p.price) + ' ' + CONFIG.currency + '</b>'; } else { estEl.hidden = true; }
    var send = main.querySelector('.vc-send');
    send.href = CONFIG.telegram + (CONFIG.telegram.indexOf('?') > -1 ? '&' : '?') + 'text=' + encodeURIComponent(msg);
    send.onclick = function () { copy(msg); };
    var cb = main.querySelector('.vc-copy');
    cb.onclick = function () { copy(msg).then(function () { cb.textContent = Q.copied; setTimeout(function () { cb.textContent = Q.copy; }, 2000); }); };
    step = total; show();
  }

  // «Обрати пакет» → квиз с уже выбранным типом
  root.addEventListener('click', function (e) {
    var b = e.target.closest('.vc-pick'); if (!b) return;
    var i = +b.getAttribute('data-plan');
    plan = i; ans[0] = ['landing', 'site', 'shop'].indexOf(CONFIG.plans[i].type);
    sent = false; step = 1; renderQuiz();
    q('#vc-quiz').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  renderHead(); renderQuiz();

  window.addEventListener('vlad:lang', function (e) {
    lang = e.detail; renderHead(); renderQuiz();
    root.querySelectorAll('.vc-r, .vc-title').forEach(function (el) { el.classList.add('is-in'); });
  });

  // появление при прокрутке
  var reveal = [].slice.call(root.querySelectorAll('.vc-r, .vc-title'));
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (en) {
      en.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    reveal.forEach(function (el) { io.observe(el); });
  } else {
    reveal.forEach(function (el) { el.classList.add('is-in'); });
  }
})();
</script>

<style>

  transition:border-color .3s,transform .5s cubic-bezier(.2,.8,.2,1)}

/* видео */
.vr-video{position:relative;flex:1;display:grid;place-items:center;min-height:260px;margin:-8px -8px 0;border-radius:18px;overflow:hidden;cursor:pointer;border:0;width:calc(100% + 16px);
  background:linear-gradient(160deg,#1d1f24,#0f1013)}

.vr-play svg{width:30px;height:30px;margin-left:4px}

.vr-dur{position:absolute;left:16px;bottom:16px;padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700}

.vr-cap{margin-top:22px;font-size:16px;line-height:1.55;font-weight:500}

/* прогресс */
.vr-progress{max-width:1320px;margin:8px auto 0;padding:0 40px}
.vr-progress div{height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.vr-progress i{display:block;height:100%;width:30%;border-radius:inherit;background:var(--ac);transform-origin:left;transition:transform .15s linear}

/* призыв оставить отзыв */
.vr-ask{display:flex;align-items:center;justify-content:space-between;gap:24px;max-width:1320px;margin:48px auto 0;padding:0 40px}

  transition:background .25s,color .25s,border-color .25s}
.vr-ask a:hover{background:var(--ac);color:var(--ink);border-color:var(--ac)}

/* окно с видео */
.vr-modal{position:fixed;inset:0;z-index:9999;display:none;place-items:center;padding:20px;background:rgba(5,5,7,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

@keyframes vr-fade{from{opacity:0}to{opacity:1}}
.vr-modal-box{position:relative;width:min(960px,100%);aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000}
.vr-modal-box.is-vert{width:min(420px,100%);aspect-ratio:9/16;max-height:86vh}
.vr-modal-box iframe,.vr-modal-box video{width:100%;height:100%;border:0;display:block}
.vr-close{position:absolute;top:18px;right:18px;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);font-size:22px;cursor:pointer}

/* появление */
.vr-r{opacity:0;transform:translateY(36px);transition:opacity .9s ease var(--d,0s),transform 1s cubic-bezier(.2,.8,.2,1) var(--d,0s)}
.vr-r.is-in{opacity:1;transform:none}

/* адаптив */
@media (max-width:760px){
  .vr{padding:80px 0}
  .vr-inner,.vr-progress,.vr-ask{padding:0 20px}
  .vr-head{margin-bottom:32px}
  .vr-arrows{display:none}
  .vr-track{padding:6px 20px 20px;cursor:auto}
  .vr-slide{scroll-margin-left:20px}
  .vr-card{min-height:400px;padding:26px 22px}
  .vr-text{font-size:16.5px}
  .vr-ask{flex-direction:column;align-items:flex-start}
  .vr-ask a{width:100%;justify-content:center}
}
@media (prefers-reduced-motion:reduce){
  .vr *{animation:none!important;transition:none!important}
  .vr .vr-r,.vr .vr-wi{opacity:1;transform:none}
}

<section class="vr" id="reviews" aria-label="Отзывы">

      <div>

<script>
(function () {

  var CONFIG = {

    /* ОТЗЫВЫ — сейчас здесь ЗАГОТОВКИ. Замени их реальными отзывами и поставь template: false.

       Тексты отзыва — в uk / en (если отзыв на одном языке, можно вписать одинаковый текст в оба). */
    reviews: [                                                                  // ← ИЗМЕНИТЬ
      { type: 'text', template: true, stars: 0, photo: '', link: '',
        uk: { name: '[Ім’я клієнта]', role: '[Бізнес · місто]', text: '[Справжній відгук клієнта: що було до сайту, що сподобалося в роботі та що змінилося після запуску.]' },
        en: { name: '[Client name]', role: '[Business · city]', text: '[A real client review: what things were like before the site, what they liked about working together and what changed after launch.]' } },
      { type: 'chat', template: true, image: '',
        uk: { name: '[Ім’я клієнта]', role: '[Бізнес · місто]', text: '[Скриншот листування в Telegram чи Instagram, де клієнт дякує за сайт]' },
        en: { name: '[Client name]', role: '[Business · city]', text: '[Screenshot of a Telegram or Instagram chat where the client thanks you for the site]' } },
      { type: 'video', template: true, video: '', poster: '', duration: '0:30', vertical: false,
        uk: { name: '[Ім’я клієнта]', role: '[Бізнес · місто]', text: '[Короткий відеовідгук на 20–40 секунд]' },
        en: { name: '[Client name]', role: '[Business · city]', text: '[A short 20–40 second video review]' } },
      { type: 'text', template: true, stars: 0, photo: '', link: '',
        uk: { name: '[Ім’я клієнта]', role: '[Бізнес · місто]', text: '[Ще один справжній відгук. Найкраще працюють конкретні деталі: терміни, заявки, зручність спілкування.]' },
        en: { name: '[Client name]', role: '[Business · city]', text: '[Another real review. Specific details work best: timelines, leads, ease of communication.]' } }
    ],

    uk: { label: 'Відгуки', title: 'Що кажуть', titleAccent: 'клієнти', templateTag: 'Заготовка',
          ask: '<b>Ми вже працювали разом?</b> Буду радий вашому відгуку.', askButton: 'Залишити відгук',
          prev: 'Назад', next: 'Вперед', play: 'Дивитися відеовідгук', close: 'Закрити', open: 'Відкрити проєкт' },   // ← ИЗМЕНИТЬ
    en: { label: 'Reviews', title: 'What clients', titleAccent: 'say', templateTag: 'Template',
          ask: '<b>Have we worked together?</b> I’d love to hear your feedback.', askButton: 'Leave a review',
          prev: 'Previous', next: 'Next', play: 'Watch video review', close: 'Close', open: 'Open project' }               // ← ИЗМЕНИТЬ
  };
  /* ======================= дальше можно не трогать ======================= */

  var VL = window.VLAD_I18N || (window.VLAD_I18N = (function () {
    function detect() {
      try {
        var u = new URLSearchParams(location.search).get('lang');
        if (u === 'uk' || u === 'en') { localStorage.setItem('vlad-lang', u); return u; }
        var s = localStorage.getItem('vlad-lang'); if (s === 'uk' || s === 'en') return s;
      } catch (e) {}
      var nl = (navigator.language || '').toLowerCase();
      return (nl.indexOf('uk') === 0 || nl.indexOf('ru') === 0) ? 'uk' : 'en';
    }
    var api = { lang: detect() };
    document.documentElement.lang = api.lang;
    api.set = function (l) {
      if (l === api.lang) return;
      api.lang = l; document.documentElement.lang = l;
      try { localStorage.setItem('vlad-lang', l); } catch (e) {}
      try { var url = new URL(location.href); if (l === 'en') url.searchParams.set('lang', 'en'); else url.searchParams.delete('lang'); history.replaceState(null, '', url); } catch (e) {}

  var root = document.getElementById('reviews');
  if (!root) return;
  var q = function (s) { return root.querySelector(s); };
  var lang = VL.lang;

  var quoteSvg = '<svg class="vr-quote" viewBox="0 0 48 48" fill="currentColor" aria-hidden="true"><path d="M8 34c0-9 4-16 12-20l2 4c-4 2-6 5-6 9h6v12H8zm20 0c0-9 4-16 12-20l2 4c-4 2-6 5-6 9h6v12H28z"/></svg>';
  var star = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.3l-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9z"/></svg>';
  var arrow = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  var playSvg = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
  function initials(name) { var s = name.replace(/[\[\]]/g, '').trim(); return s ? s.charAt(0).toUpperCase() : '★'; }

  function render() {
    var T = CONFIG[lang] || CONFIG.uk;
    q('.vr-label').textContent = T.label;
    var html = '', n = 0;
    function addWords(text, cls) {

    q('.vr-prev').setAttribute('aria-label', T.prev);
    q('.vr-next').setAttribute('aria-label', T.next);
    q('.vr-close').setAttribute('aria-label', T.close);

    function author(r, t) {
      return '<div class="vr-author"><span class="vr-ava">' + (r.photo ? '<img src="' + r.photo + '" alt="">' : initials(t.name)) + '</span>' +
        '<div><p class="vr-name">' + t.name + '</p><p class="vr-role">' + t.role + '</p></div>' +
        (r.link ? '<a class="vr-proj" href="' + r.link + '" target="_blank" rel="noopener" aria-label="' + T.open + '">' + arrow + '</a>' : '') + '</div>';
    }
    q('.vr-track').innerHTML = CONFIG.reviews.map(function (r, i) {
      var t = r[lang] || r.uk;
      var tpl = r.template ? '<span class="vr-tpl">' + T.templateTag + '</span>' : '';
      var body;
      if (r.type === 'chat') {
        body = '<div class="vr-chat"><div class="vr-phone">' + (r.image ? '<img src="' + r.image + '" alt="">' :
          '<i class="vr-bub b1"></i><i class="vr-bub me b2"></i><i class="vr-bub b3"></i><i class="vr-bub b4"></i><span class="vr-heart">💜</span>') + '</div></div>' +
          '<p class="vr-cap">' + t.text + '</p>' + author(r, t);
      } else if (r.type === 'video') {
        body = '<button type="button" class="vr-video" data-i="' + i + '" aria-label="' + T.play + '">' + (r.poster ? '<img src="' + r.poster + '" alt="">' : '') +

    var ext = /^https?:/.test(CONFIG.telegram) ? ' target="_blank" rel="noopener"' : '';

  }

  var track = q('.vr-track'), prev = q('.vr-prev'), next = q('.vr-next'), bar = q('.vr-progress i');

    var p = max > 0 ? track.scrollLeft / max : 0;

    var down = false, sx = 0, sl = 0, moved = 0;
    track.addEventListener('pointerdown', function (e) { if (e.button !== 0) return; down = true; moved = 0; sx = e.clientX; sl = track.scrollLeft; });
    window.addEventListener('pointermove', function (e) {
      if (!down) return;
      var dx = e.clientX - sx; moved = Math.max(moved, Math.abs(dx));

  window.addEventListener('vlad:lang', function (e) {
    lang = e.detail; render(); onScroll();

  });

  var reveal = [].slice.call(root.querySelectorAll('.vr-r, .vr-title'));

      en.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); onScroll(); } });

  }

<style>

<script>
(function () {
  /* =================================================================
     CONFIG — ВСЁ, ЧТО МОЖНО МЕНЯТЬ, НАХОДИТСЯ ЗДЕСЬ
     Тексты — в двух языках: uk и en. Цвета — в начале <style>.
     ================================================================= */
  var CONFIG = {
    telegram: 'https://t.me/Tim1949',          // ← ИЗМЕНИТЬ: твой Telegram
    photo: '',                                       // ← ИЗМЕНИТЬ: фото в карточке «Не знайшли відповідь?» (пусто — буква)

    uk: {                                                                         // ← ИЗМЕНИТЬ
      label: 'FAQ', title: 'Часті', titleAccent: 'запитання',
      lead: 'Зібрав відповіді на те, що питають найчастіше. Якщо вашого запитання тут немає — просто напишіть мені.',
      search: 'Пошук за запитаннями…',
      empty: 'Такого запитання поки немає. <a href="{tg}" target="_blank" rel="noopener">Запитайте мене в Telegram →</a>',
      help: { initial: 'В', name: 'Влад', status: 'Відповідаю особисто в Telegram', text: 'Не знайшли відповідь? Напишіть мені — розберемося.', button: 'Написати в Telegram' },
      items: [
        { q: 'Скільки коштує сайт і від чого залежить ціна?', a: 'Ціна залежить від типу сайту, кількості блоків чи сторінок, товарів, мов і анімацій. Орієнтири за пакетами — у розділі <a href="#prices">«Ціни»</a>, а точну вартість я назву після короткого брифу, ще до початку роботи.' },
        { q: 'Скільки часу займає розробка?', a: 'Залежить від обсягу: лендинг робиться найшвидше, інтернет-магазин — довше. Точний термін я називаю разом із ціною до старту, і ми фіксуємо його в домовленостях.' },
        { q: 'Чи потрібно мені готувати тексти й фото?', a: 'Якщо вони є — чудово. Якщо ні — допоможу зі структурою й текстами, підкажу, які фото краще підготувати чи де взяти якісні зображення.' },
        { q: 'Чи зможу я сам змінювати тексти, ціни й товари?', a: 'Так. Після запуску покажу, як редагувати сайт: змінювати тексти, фото, ціни й додавати товари без програміста.' },
        { q: 'Як відбувається оплата?', a: 'Працюю за передоплатою: після погодження структури й ціни ви вносите першу частину, залишок — перед запуском сайту. Усе прозоро й поетапно.' },
        { q: 'Що, як мені не сподобається дизайн?', a: 'Спершу я показую перший екран і лише після вашого схвалення роблю решту. Далі вношу правки за вашими коментарями — кількість кіл правок обговорюємо заздалегідь.' },
        { q: 'Хто оплачує домен і хостинг?', a: 'Домен і хостинг оформлюються на вас і оплачуються окремо — так сайт повністю належить вам. Допоможу обрати відповідні й усе підключу.' },
        { q: 'Чи працюєте з клієнтами з інших міст і країн?', a: 'Так, працюю віддалено: спілкування в Telegram, за потреби — онлайн-дзвінки. Наприклад, сайт для бренду прикрас elladevil робився для клієнта з Риги.' },
        { q: 'Чи допомагаєте після запуску?', a: 'Так, не зникаю після здачі проєкту: допомагаю з правками, підказую, як розвивати сайт, і можу взяти його на підтримку.' }
      ]
    },
    en: {                                                                         // ← ИЗМЕНИТЬ
      label: 'FAQ', title: 'Frequently asked', titleAccent: 'questions',
      lead: 'Answers to the questions I get asked most. If yours isn’t here, just message me.',
      search: 'Search questions…',
      empty: 'No such question yet. <a href="{tg}" target="_blank" rel="noopener">Ask me on Telegram →</a>',
      help: { initial: 'V', name: 'Vlad', status: 'I reply personally on Telegram', text: 'Didn’t find an answer? Message me — we’ll figure it out.', button: 'Message me on Telegram' },
      items: [
        { q: 'How much does a website cost, and what affects the price?', a: 'The price depends on the type of site, the number of blocks or pages, products, languages and animations. You’ll find package guides in <a href="#prices">Pricing</a>, and I’ll give you the exact cost after a short brief, before any work starts.' },
        { q: 'How long does development take?', a: 'It depends on scope: a landing page is the quickest, an online store takes longer. I give you the exact timeline together with the price before we start, and we put it in our agreement.' },
        { q: 'Do I need to prepare copy and photos?', a: 'If you have them — great. If not, I’ll help with the structure and copy and suggest which photos to prepare or where to get quality images.' },
        { q: 'Can I edit texts, prices and products myself?', a: 'Yes. After launch I’ll show you how to edit the site: change texts, photos and prices and add products without a developer.' },
        { q: 'How does payment work?', a: 'I work with a deposit: once we agree on the structure and price, you pay the first part, and the rest before launch. Everything is transparent and step by step.' },
        { q: 'What if I don’t like the design?', a: 'I show you the first screen first and only build the rest after you approve it. Then I make changes based on your feedback — we agree on the number of revision rounds in advance.' },
        { q: 'Who pays for the domain and hosting?', a: 'The domain and hosting are registered in your name and paid separately, so the site fully belongs to you. I’ll help you choose and set everything up.' },
        { q: 'Do you work with clients from other cities and countries?', a: 'Yes, I work remotely: we talk on Telegram and have online calls when needed. For example, the elladevil jewelry site was built for a client in Riga.' },
        { q: 'Do you help after launch?', a: 'Yes, I don’t disappear after handing over the project: I help with edits, advise on growing the site and can take it on for ongoing support.' }
      ]
    }
  };
  /* ======================= дальше можно не трогать ======================= */

  var VL = window.VLAD_I18N || (window.VLAD_I18N = (function () {
    function detect() {
      try {
        var u = new URLSearchParams(location.search).get('lang');
        if (u === 'uk' || u === 'en') { localStorage.setItem('vlad-lang', u); return u; }
        var s = localStorage.getItem('vlad-lang'); if (s === 'uk' || s === 'en') return s;
      } catch (e) {}
      var nl = (navigator.language || '').toLowerCase();
      return (nl.indexOf('uk') === 0 || nl.indexOf('ru') === 0) ? 'uk' : 'en';
    }
    var api = { lang: detect() };
    document.documentElement.lang = api.lang;
    api.set = function (l) {
      if (l === api.lang) return;
      api.lang = l; document.documentElement.lang = l;
      try { localStorage.setItem('vlad-lang', l); } catch (e) {}
      try { var url = new URL(location.href); if (l === 'en') url.searchParams.set('lang', 'en'); else url.searchParams.delete('lang'); history.replaceState(null, '', url); } catch (e) {}
      window.dispatchEvent(new CustomEvent('vlad:lang', { detail: l }));
    };
    return api;
  })());

  var root = document.getElementById('faq');
  if (!root) return;
  var q = function (s) { return root.querySelector(s); };
  var lang = VL.lang, openIdx = 0;
  var input = q('.vq-search input');
  var arrow = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  var pad = function (k) { return (k < 10 ? '0' : '') + k; };
  var items = [];

  function render() {
    var T = CONFIG[lang] || CONFIG.uk;
    q('.vq-label').textContent = T.label;
    q('.vq-lead').textContent = T.lead;
    input.placeholder = T.search;
    input.setAttribute('aria-label', T.search);
    q('.vq-empty').innerHTML = T.empty.replace('{tg}', CONFIG.telegram);
    var html = '', n = 0;
    function addWords(text, cls) {
      text.split(' ').forEach(function (w) {
        if (!w) return;
        html += '<span class="vq-w"><span class="vq-wi' + (cls ? ' ' + cls : '') + '" style="--d:' + (n * 0.08).toFixed(2) + 's">' + w + '</span></span> ';
        n++;
      });
    }
    addWords(T.title, ''); addWords(T.titleAccent, 'vq-acc');
    q('.vq-title').innerHTML = html;

    var h = T.help;
    var helpHtml = '<div class="vq-who"><span class="vq-ava">' + (CONFIG.photo ? '<img src="' + CONFIG.photo + '" alt="">' : h.initial) + '</span><div><b>' + h.name + '</b><span>' + h.status + '</span></div></div>' +
      '<p class="vq-help-text">' + h.text + '</p><span class="vq-typing" aria-hidden="true"><i></i><i></i><i></i></span>' +
      '<a class="vq-btn" href="' + CONFIG.telegram + '" target="_blank" rel="noopener">' + h.button + '<span class="vq-btn-ico">' + arrow + '</span></a>';
    root.querySelectorAll('.vq-help').forEach(function (el) { el.innerHTML = helpHtml; });

    q('.vq-list').innerHTML = T.items.map(function (it, i) {
      var open = i === openIdx;
      return '<div class="vq-item vq-r' + (open ? ' is-open' : '') + '" style="--d:' + Math.min(0.05 * i, 0.3).toFixed(2) + 's">' +
        '<button type="button" class="vq-q" aria-expanded="' + open + '" aria-controls="vq-a' + i + '" id="vq-q' + i + '">' +
        '<span class="vq-num">' + pad(i + 1) + '</span><span class="vq-qt">' + it.q + '</span><span class="vq-pm" aria-hidden="true"></span></button>' +
        '<div class="vq-a" id="vq-a' + i + '" role="region" aria-labelledby="vq-q' + i + '"><div><p>' + it.a + '</p></div></div></div>';
    }).join('');
    items = [].slice.call(root.querySelectorAll('.vq-item'));
    if (input.value) search();
  }

  q('.vq-list').addEventListener('click', function (e) {
    var b = e.target.closest('.vq-q'); if (!b) return;
    var it = b.parentNode, open = !it.classList.contains('is-open');
    items.forEach(function (x) { x.classList.remove('is-open'); x.querySelector('.vq-q').setAttribute('aria-expanded', 'false'); });
    openIdx = -1;
    if (open) { it.classList.add('is-open'); b.setAttribute('aria-expanded', 'true'); openIdx = items.indexOf(it); }
  });

  function esc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function search() {
    var T = CONFIG[lang] || CONFIG.uk;
    var raw = input.value.trim(), v = raw.toLowerCase(), shown = 0, first = null;
    items.forEach(function (it, i) {
      var data = T.items[i];
      var text = (data.q + ' ' + data.a.replace(/<[^>]+>/g, '')).toLowerCase();
      var ok = !v || text.indexOf(v) > -1;
      it.hidden = !ok;
      it.querySelector('.vq-qt').innerHTML = v && ok ? data.q.replace(new RegExp('(' + esc(raw) + ')', 'ig'), '<mark>$1</mark>') : data.q;
      if (ok) { shown++; if (!first) first = it; }
    });
    q('.vq-empty').classList.toggle('is-on', shown === 0);
    if (v && first && !first.classList.contains('is-open')) {
      items.forEach(function (x) { x.classList.remove('is-open'); });
      first.classList.add('is-open'); openIdx = items.indexOf(first);
    }
  }
  input.addEventListener('input', search);

  root.addEventListener('click', function (e) {
    var a = e.target.closest('a[href^="#"]'); if (!a) return;
    var id = a.getAttribute('href').slice(1);
    var t = id && (document.getElementById(id) || document.querySelector('[name="' + id + '"]'));
    if (t) { e.preventDefault(); t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  });

  render();
  window.addEventListener('vlad:lang', function (e) {
    lang = e.detail; render();
    root.querySelectorAll('.vq-r, .vq-title').forEach(function (el) { el.classList.add('is-in'); });
  });

  var reveal = [].slice.call(root.querySelectorAll('.vq-r, .vq-title'));
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (en) {
      en.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); } });
    }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });
    reveal.forEach(function (el) { io.observe(el); });
  } else {
    reveal.forEach(function (el) { el.classList.add('is-in'); });
  }
})();

<style>
html,body{margin:0}

.vf,.vf-float,.vf-game{--bg:#faf9f7;--fg:#15121f;--muted:#6b6779;--ac:#6a3dff;--ac2:#ff6ec7;--ink:#ffffff;--line:rgba(21,18,31,.09);--card:#ffffff;--soft:rgba(21,18,31,.03);--soft2:rgba(21,18,31,.05);--bd:rgba(21,18,31,.14);--bd2:rgba(21,18,31,.26);--chrome:#efedf3;--chrome2:#e2dfea;--dot:#cdc9d8;--frame:#f4f2f8;--view:#f1eff6;--shadow:rgba(40,25,90,.18)}

.vf{

.vf ul{list-style:none}

/* большая бегущая строка */
.vf-big{padding:56px 0 40px;overflow:hidden;border-bottom:1px solid var(--line)}
.vf-big-track{display:flex;align-items:center;width:max-content;animation:vf-marq 28s linear infinite}

.vf-ct b{display:block;font-size:16px}

/* форма */
