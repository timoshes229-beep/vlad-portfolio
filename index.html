.vh-aur .a3{width:420px;height:420px;right:-80px;bottom:-60px;background:#3a1fb8;opacity:.5;animation:vh-a3 15s ease-in-out infinite alternate}
.vh-aur .a4{width:340px;height:340px;left:38%;top:-180px;background:color-mix(in srgb,var(--ac) 45%,#ffffff);opacity:.45;animation:vh-a2 23s ease-in-out infinite alternate-reverse}
html[data-vtheme="dark"] .vh-aur i{opacity:.32}
@keyframes vh-a1{to{transform:translate(-180px,140px) scale(1.15)}}
@keyframes vh-a2{to{transform:translate(160px,-120px) scale(.9)}}
@keyframes vh-a3{to{transform:translate(-220px,-70px) scale(1.2)}}
@media (max-width:980px){
.vh-aur .a1{width:420px;height:420px;right:-160px;top:auto;bottom:-60px}
.vh-aur .a4{display:none}
}
.vh-acc{font-variant-ligatures:none}
.vh-acc.is-scr{animation:none}
.vh-snav{position:fixed;left:50%;top:14px;z-index:9990;display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;
background:color-mix(in srgb,var(--card) 80%,transparent);border:1px solid var(--line);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);
box-shadow:0 16px 40px -18px var(--shadow);font-family:'Manrope',system-ui,sans-serif;color:var(--fg);-webkit-font-smoothing:antialiased;
transform:translate(-50%,-150%);opacity:0;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s;max-width:calc(100vw - 24px)}
.vh-snav.is-on{transform:translate(-50%,0);opacity:1}
.vh-snav *{box-sizing:border-box;margin:0;padding:0}
.vh-snav a{text-decoration:none;color:inherit}
.vh-snav-logo{padding:0 10px 0 14px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:17px;letter-spacing:-.03em;white-space:nowrap}
.vh-snav-logo i{font-style:normal;color:var(--ac)}
.vh-snav-links{position:relative;display:flex;gap:2px}
.vh-snav-pill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:var(--fg);opacity:0;
transition:transform .5s cubic-bezier(.2,.8,.2,1),width .5s cubic-bezier(.2,.8,.2,1),opacity .3s}
.vh-snav .vh-snav-links a{position:relative;z-index:1;display:block;padding:10px 14px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;transition:color .35s}
.vh-snav .vh-snav-links a:hover{color:var(--fg)}
.vh-snav .vh-snav-links a.is-on{color:var(--bg)}
.vh-snav .vh-snav-cta{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;background:var(--ac);color:#fff;font-size:13.5px;font-weight:700;white-space:nowrap;transition:transform .3s}
.vh-snav .vh-snav-cta:hover{transform:scale(1.04)}
.vh-snav-cta svg{width:15px;height:15px}
.vh-snav-cur{display:none;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vh-snav-cur b{color:var(--ac);margin-right:6px;font-family:'Unbounded',sans-serif;font-size:11px}
@media (max-width:900px){
.vh-snav{width:calc(100vw - 24px);justify-content:space-between;top:10px}
.vh-snav-links{display:none}
.vh-snav-cur{display:block;flex:1;padding:0 6px}
.vh-snav .vh-snav-cta span{display:none}
.vh-snav .vh-snav-cta{width:42px;padding:0;justify-content:center}
}
.vh-photo{position:absolute;inset:0;display:none;overflow:hidden;will-change:transform}
.vh--bg-photo .vh-photo,.vh--bg-photo .vh-aur{display:block}
.vh--bg-photo .vh-pix{display:block;z-index:2}
.vh--bg-photo .vh-glow{display:none}
.vh-photo-img{position:absolute;inset:-5%;background-size:cover;background-position:var(--ppos,center);opacity:0;transition:opacity .5s ease;
-webkit-mask-image:linear-gradient(90deg,transparent 28%,rgba(0,0,0,.55) 46%,#000 64%);mask-image:linear-gradient(90deg,transparent 28%,rgba(0,0,0,.55) 46%,#000 64%)}
.vh-photo-img.is-loaded{opacity:1;animation:vh-kb 28s ease-in-out infinite alternate}
@keyframes vh-kb{from{transform:scale(1.04)}to{transform:scale(1.14) translate(-1.5%,1%)}}
html[data-vtheme="dark"] .vh-photo-img{filter:brightness(.78) saturate(1.1)}
.vh-reveal{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
@media (max-width:980px){
.vh-photo-img{-webkit-mask-image:linear-gradient(180deg,transparent 38%,rgba(0,0,0,.6) 55%,#000 72%);mask-image:linear-gradient(180deg,transparent 38%,rgba(0,0,0,.6) 55%,#000 72%)}
}
@media (prefers-reduced-motion:reduce){ .vh-photo-img.is-loaded{animation:none} }
</style>

<script>
(function () {
  /* =================================================================
     CONFIG — ВСЁ, ЧТО МОЖНО МЕНЯТЬ, НАХОДИТСЯ ЗДЕСЬ
     Тексты — в двух языках: uk и en.
     ================================================================= */
  var CONFIG = {
    ringRepeat: 2,                                   // сколько раз слово повторяется по кругу (слово — в uk/en: ring)
    telegram: 'https://t.me/Tim1949',                // ← ИЗМЕНИТЬ: главная кнопка
    image: 'img/hero-1.webp',                        // ← ИЗМЕНИТЬ: картинка по центру обложки (на тёмном фоне — чёрное станет прозрачным)
    photo: '',                                       // ← ИЗМЕНИТЬ: фото БЕЗ ФОНА (PNG/WebP с прозрачностью), например 'img/vlad.webp' — встаёт вместо картинки
    fly: false,                                      // ← «v» улетает с обложки в блок «Услуги» (true / false)
    pin: 5,                                          // длина блока в экранах прокрутки (больше — медленнее)

    uk: {                                                                         // ← ИЗМЕНИТЬ
      script: 'vlad.webdesign7', ring: 'ПОРТФОЛІО', edit: 'Влад редагує', status: 'Відкритий для нових проєктів',
      title: 'Створюю сайти, які <em>продають</em>',
      sub: 'Лендинги, багатосторінкові сайти та інтернет-магазини з дизайном під ваш бренд. Красиво, швидко й ідеально на телефоні.',
      main: 'Обговорити проєкт', second: 'Дивитися роботи',
      facts: ['Дизайн під бренд, не шаблон', 'Адаптив під будь-який телефон', 'Прямий контакт без менеджерів'],
      hint: 'Гортайте — сайт сховається в ноутбук ↓', cta: 'Усі роботи', open: 'Відкрити сайт ↗'
    },
    en: {                                                                         // ← ИЗМЕНИТЬ
      script: 'vlad.webdesign7', ring: 'PORTFOLIO', edit: 'Vlad is editing', status: 'Available for new projects',
      title: 'I build websites that <em>sell</em>',
      sub: 'Landing pages, multi-page websites and online stores designed around your brand. Beautiful, fast and perfect on mobile.',
      main: 'Discuss a project', second: 'See my work',
      facts: ['Custom design, no templates', 'Perfect on any phone', 'Direct contact, no managers'],
      hint: 'Scroll — this site slides into a laptop ↓', cta: 'All projects', open: 'Open site ↗'
    },

    /* Работы на экране ноутбука. image — ключ из VLAD_SHOTS (или ссылка на длинный скриншот). */
    projects: [
      { name: 'PADRE Barbershop', image: 'padre', link: 'https://gorgeous-cassata-2d0ce3.netlify.app/', uk: 'Барбершоп · Одеса', en: 'Barbershop · Odesa' },
      { name: 'elladevil', image: 'ella', link: 'https://timoshes229-beep.github.io/elladevil/', uk: 'Біжутерія · Рига', en: 'Jewelry · Riga' },
      { name: 'Synergy GK', image: 'syn', link: 'https://timoshes229-beep.github.io/synergy-gk/', uk: 'Воротарські рукавиці', en: 'Goalkeeper gloves' },
      { name: 'Mareva Dental', image: 'mareva', link: 'https://timoshes229-beep.github.io/mareva/', uk: 'Стоматологія · Одеса', en: 'Dental clinic · Odesa' },
      { name: 'Happy Finance', image: 'happy', link: 'https://timoshes229-beep.github.io/HAPPY-FINANCE/', uk: 'Бухгалтерія для ФОП і ТОВ', en: 'Accounting for businesses' },
      { name: 'Blog Start', image: 'olya', link: 'https://timoshes229-beep.github.io/olya/', uk: 'Онлайн-інтенсив із блогінгу', en: 'Blogging online course' },
      { name: 'ВІДЧИНЕНО', image: 'vid', link: 'https://timoshes229-beep.github.io/vidchyneno/', uk: 'Запуск закладів під ключ', en: 'Turnkey restaurant launch' }
    ]
  };
  /* ======================= дальше можно не трогать ======================= */

  var root = document.getElementById('intro');
  if (!root) return;
  var q = function (s) { return root.querySelector(s); };
  var pin = q('.vl-pin'), st = q('.vl-sticky'), view = q('.vl-view'), lap = q('.vl-laptop'), scr = q('.vl-screen'),
      works = q('.vl-works'), cap = q('.vl-cap'), bar = q('.vl-bar i'), txt = q('.vl-txt');
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var SH = window.VLAD_SHOTS || {};
  var lang = (window.VLAD_I18N && window.VLAD_I18N.lang) || 'uk';
  var N = CONFIG.projects.length;
  root.style.setProperty('--pin', reduce ? 1 : CONFIG.pin);

  q('.vl-btn--main').href = CONFIG.telegram;
  if (CONFIG.photo) {
    var ph = new Image(); ph.className = 'vl-photo'; ph.src = CONFIG.photo; ph.alt = '';
    q('.vl-hero').replaceWith(ph);
  } else if (CONFIG.image) q('.vl-hero img').src = CONFIG.image;
  else q('.vl-hero').remove();

  /* клавиатура ноутбука */
  var keys = '';
  for (var r = 0; r < 5; r++) for (var c = 0; c < 14; c++) keys += '<i></i>';
  keys += '<i></i><i></i><i></i><i class="sp"></i><i></i><i></i><i></i><i></i><i></i>';
  q('.vl-keys').innerHTML = keys;

  var shots = CONFIG.projects.map(function (p, j) {
    var d = document.createElement('div'); d.className = 'vl-shot'; d.style.zIndex = j;
    var im = new Image(); im.src = SH[p.image] || p.image; im.alt = p.name; im.decoding = 'async';
    d.appendChild(im); works.appendChild(d);
    return { el: d, img: im };
  });

  /* летающая «v» */
  var fly = null;
  if (CONFIG.fly && CONFIG.image && !CONFIG.photo) {
    fly = document.createElement('div'); fly.className = 'vl-vfly'; fly.setAttribute('aria-hidden', 'true');
    fly.innerHTML = '<img src="' + CONFIG.image + '" alt="">';
    document.body.appendChild(fly);
    document.documentElement.classList.add('has-vfly');
  }

  var check = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var cur = -1;
  /* вращающееся слово: буквы стоят по кругу на невидимом цилиндре */
  function buildRing(word) {
    var box = q('.vl-word'), chars = [];
    for (var k = 0; k < CONFIG.ringRepeat; k++) { word.split('').forEach(function (c) { chars.push({ c: c }); }); chars.push({ c: '✦', s: 1 }); }
    box.innerHTML = '<div class="vl-ring"><div class="vl-ring-in"></div></div>';
    var inner = box.querySelector('.vl-ring-in'), meas = document.createElement('span');
    meas.style.cssText = 'position:absolute;visibility:hidden;white-space:pre';
    box.appendChild(meas);
    var gap = parseFloat(getComputedStyle(box).fontSize) * .05, total = 0;
    chars.forEach(function (o) { meas.textContent = o.c; o.w = meas.offsetWidth + gap; total += o.w; });
    meas.remove();
    var r = total / (2 * Math.PI), acc = 0;
    chars.forEach(function (o) {
      var a = (acc + o.w / 2) / total * 360; acc += o.w;
      var el = document.createElement('span'); el.className = 'vl-ch' + (o.s ? ' s' : '');
      el.style.transform = 'rotateY(' + a.toFixed(2) + 'deg) translateZ(' + r.toFixed(1) + 'px)';
      el.innerHTML = '<b class="f">' + o.c + '</b><b class="b">' + o.c + '</b>';
      inner.appendChild(el);
    });
  }

  function render() {
    var T = CONFIG[lang] || CONFIG.uk;
    q('.vl-script').textContent = T.script;
    buildRing(T.ring);
    q('.vl-t-status').textContent = T.status;
    q('.vl-h1').innerHTML = T.title;
    q('.vl-sub').textContent = T.sub;
    q('.vl-t-main').textContent = T.main;
    q('.vl-btn--ghost').textContent = T.second;
    q('.vl-facts').innerHTML = T.facts.map(function (f) { return '<li>' + check + f + '</li>'; }).join('');
    q('.vl-t-hint').textContent = T.hint;
    q('.vl-t-cta').textContent = T.cta;
    q('.vl-open').textContent = T.open;
    q('.vl-total').textContent = pad(N);
    setCap(Math.max(cur, 0), true);
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function setCap(i, silent) {
    var p = CONFIG.projects[i];
    q('.vl-n').textContent = pad(i + 1);
    q('.vl-name').textContent = p.name;
    q('.vl-niche').textContent = p[lang] || p.uk;
    if (!silent) { txt.classList.remove('is-swap'); void txt.offsetWidth; txt.classList.add('is-swap'); }
  }

  var L = {};
  function layout() {
    var W = st.clientWidth, H = st.clientHeight, mob = W < 700;
    root.classList.toggle('is-mob', mob);
    var w = mob ? W - 32 : Math.min(W * .62, (H - 220) / .85, 1120), h = w / 1.6;
    var bz = Math.max(7, Math.round(w * .016)), cx = W / 2, cy = mob ? H * .4 : 80 + bz + h / 2;
    L = { W: W, H: H, w: w, h: h, cx: cx, cy: cy, mob: mob, kf: Math.max(w / W, h / H) };
    L.ix = (W - w / L.kf) / 2; L.iy = (H - h / L.kf) / 2;
    view.style.width = W + 'px'; view.style.height = H + 'px';
    lap.style.left = (cx - w / 2 - bz) + 'px'; lap.style.top = (cy - h / 2 - bz) + 'px'; lap.style.width = (w + 2 * bz) + 'px';
    lap.style.transformOrigin = (bz + w / 2) + 'px ' + (bz + h / 2) + 'px';
    lap.style.setProperty('--w', w + 'px');
    scr.style.height = (h + 2 * bz) + 'px'; scr.style.borderWidth = bz + 'px';
    cap.style.left = (cx - w / 2 - bz) + 'px'; cap.style.width = (w + 2 * bz) + 'px';
    lap.style.transform = 'none';
    var fb = q('.vl-front').getBoundingClientRect().bottom - st.getBoundingClientRect().top;
    cap.style.top = (fb + (mob ? 22 : 28)) + 'px';
    update();
  }

  function cl(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function ease(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

  var E = 0;   // насколько обложка уже «в ноутбуке» (0..1) — нужно курсору
  function update() {
    var r = pin.getBoundingClientRect();
    var p = reduce ? .36 : cl(-r.top / Math.max(1, pin.offsetHeight - L.H));

    /* 1) обложка уезжает в экран ноутбука */
    var e = ease(cl((p - .05) / .25)), k = 1 + (L.kf - 1) * e;
    E = e;
    var x = L.W / 2 + (L.cx - L.W / 2) * e, y = L.H / 2 + (L.cy - L.H / 2) * e;
    var ix = L.ix * e, iy = L.iy * e;
    view.style.transform = 'translate(' + (x - L.W / 2 * k) + 'px,' + (y - L.H / 2 * k) + 'px) scale(' + k + ')';
    view.style.clipPath = 'inset(' + iy + 'px ' + ix + 'px round ' + (e * 8 / L.kf) + 'px)';
    view.style.pointerEvents = e > .02 ? 'none' : '';
    var fs = Math.max((L.W - 2 * ix) * k / L.w, (L.H - 2 * iy) * k / L.h);
    lap.style.transform = 'translate(' + (x - L.cx) + 'px,' + (y - L.cy) + 'px) scale(' + fs + ')';
    lap.style.opacity = cl(e * 2.5);

    /* 2) на экране включаются работы */
    var s = cl((p - .31) / .05);
    works.style.opacity = s; cap.style.opacity = s;
    cap.style.pointerEvents = s > .5 ? 'auto' : 'none';
    scr.classList.toggle('is-live', s > .5);

    /* 3) работы листаются по очереди */
    var qn = cl((p - .35) / .6) * N, i = Math.min(N - 1, Math.floor(qn)), t = Math.min(1, qn - i);
    shots.forEach(function (o, j) {
      var el = o.el, im = o.img;
      if (j === i) {
        var sh = im.naturalWidth ? Math.max(0, L.w * im.naturalHeight / im.naturalWidth - L.h) : 0;
        el.style.visibility = 'visible'; el.style.clipPath = 'none';
        im.style.transform = 'translateY(' + (-sh * ease(cl(t / .8))) + 'px)';
      } else if (j === i + 1 && t > .8) {
        el.style.visibility = 'visible'; el.style.clipPath = 'inset(' + ((1 - ease((t - .8) / .2)) * 100) + '% 0 0 0)';
        im.style.transform = 'none';
      } else {
        el.style.visibility = 'hidden';
      }
    });
    bar.style.transform = 'scaleX(' + cl(qn / N) + ')';
    if (i !== cur) { var first = cur < 0; cur = i; setCap(i, first); }
  }

  /* ---- «v»: обложка → рядом с ноутбуком → своё место в блоке «Услуги» ---- */
  var F = { x: 0, y: 0, w: 0, ready: false }, A = null, landed = false, M = { x: 0, y: 0 };
  function flyTarget() {
    var W = innerWidth, H = innerHeight;
    var spot = document.querySelector('#services .vb-land');
    if (spot) {
      var sr = document.getElementById('services').getBoundingClientRect();
      if (sr.top < H * .8) { var r = spot.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, m: 's', off: r.bottom < 0 || r.top > H }; }
    }
    var top = st.getBoundingClientRect().top, e = E;
    if (!A || e < .001) { var h = q('.vl-hero').getBoundingClientRect(); A = { x: h.left + h.width / 2, y: h.top + h.height / 2 - top, w: h.width }; }
    var z = L.mob ? { x: W * .84, y: L.cy - L.h / 2 - W * .1, w: W * .26 }
                  : { x: (L.cx + L.w / 2 + W) / 2, y: L.cy - L.h * .18, w: Math.min((W - L.w) / 2 * .85, L.h * .5) };
    return { x: A.x + (z.x - A.x) * e + M.x * (1 - e), y: A.y + (z.y - A.y) * e + top + M.y * (1 - e), w: A.w + (z.w - A.w) * e, m: 'i' };
  }
  function flyLoop() {
    var T = flyTarget(), d = Math.abs(T.x - F.x) + Math.abs(T.y - F.y) + Math.abs(T.w - F.w);
    if (T.m !== 's') landed = false; else if (d < 2) landed = true;
    var kk = reduce || !F.ready || landed || T.off ? 1 : .1;
    F.x += (T.x - F.x) * kk; F.y += (T.y - F.y) * kk; F.w += (T.w - F.w) * kk; F.ready = true;
    var sc = F.w / 400;
    fly.style.transform = 'translate(' + (F.x - F.w / 2).toFixed(1) + 'px,' + (F.y - F.w / 2).toFixed(1) + 'px) scale(' + sc.toFixed(4) + ')';
    requestAnimationFrame(flyLoop);
  }
  if (fly && !reduce && matchMedia('(pointer:fine)').matches) {
    view.addEventListener('mousemove', function (ev) { M.x = (ev.clientX / L.W - .5) * 30; M.y = (ev.clientY / L.H - .5) * 20; });
    view.addEventListener('mouseleave', function () { M.x = 0; M.y = 0; });
  }
  window.addEventListener('resize', function () { A = null; });

  var tick = false;
  function onScroll() { if (tick) return; tick = true; requestAnimationFrame(function () { tick = false; update(); }); }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', layout);
  shots.forEach(function (o) { o.img.addEventListener('load', onScroll); });

  scr.addEventListener('click', function () {
    if (!scr.classList.contains('is-live')) return;
    window.open(CONFIG.projects[Math.max(cur, 0)].link, '_blank', 'noopener');
  });
  root.addEventListener('click', function (ev) {
    var a = ev.target.closest('a[href^="#"]'); if (!a) return;
    var t = document.getElementById(a.getAttribute('href').slice(1));
    if (t) { ev.preventDefault(); t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  });

  window.addEventListener('vlad:lang', function (ev) { lang = ev.detail; render(); });
  render();
  layout();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { buildRing((CONFIG[lang] || CONFIG.uk).ring); });
  var rT; window.addEventListener('resize', function () { clearTimeout(rT); rT = setTimeout(function () { buildRing((CONFIG[lang] || CONFIG.uk).ring); }, 200); });
  if (fly) requestAnimationFrame(flyLoop);
})();
</script>

<style>
/* ===== ОБЛОЖКА: закрученное «ПОРТФОЛІО», светлая (вариант C)  ← ИЗМЕНИТЬ: data-cv в setCover — a / b / c ===== */
#intro .tw,#intro .wh{display:none}
#intro[data-cv] .tw{--twc:#fff;display:block;position:absolute;inset:0;z-index:2;pointer-events:none;color:#fff}

.tw-x::after{left:0;top:50%;width:100%;height:1px}
.tw-bar{position:absolute;left:50%;top:9cqh;width:min(10cqw,17cqh);height:37cqh;transform:translateX(-50%);background:linear-gradient(180deg,#7a52ff,#6a3dff);box-shadow:0 30px 90px -20px rgba(106,61,255,.8)}

(function () {

            en: { wel: 'Welcome<br>to my', word: 'PORTFOLIO', name: 'Vlad', role: 'Web designer', ring: 'PORTFOLIO • VLAD.WEBDESIGN7 • ', me: 'ME' } };
  var lang = (window.VLAD_I18N && window.VLAD_I18N.lang) || 'uk';
  var SH = window.VLAD_SHOTS || {}, shots = ['ella', 'syn', 'olya', 'padre', 'vid', 'mareva', 'happy'];
  function render() {
    var t = T[lang] || T.uk;
    root.querySelector('.tw-wel').innerHTML = t.wel;
    root.querySelector('.tw-name').textContent = t.name; root.querySelector('.tw-role').textContent = t.role;
    root.querySelector('.tw-word').innerHTML = t.word.split('').map(function (c, i) {
      return '<span class="tw-l"><span class="tw-d" style="--i:' + i + '"><b>' + c + '</b><b class="bk">' + c + '</b></span></span>';
    }).join('');
    root.querySelector('.wh-txt').textContent = t.ring + t.ring;
    root.querySelector('.wh-me').textContent = t.me;
  }
  /* колесо: 14 карточек (сайты по кругу дважды) */
  var spin = root.querySelector('.wh-spin'), n = 14;
  for (var i = 0; i < n; i++) {
    var c = document.createElement('div'); c.className = 'wh-c';
    c.style.setProperty('--a', (i * 360 / n) + 'deg');
    c.style.backgroundImage = 'url("' + SH[shots[i % shots.length]] + '")';
    spin.appendChild(c);
  }
  function set(v) {
    root.setAttribute('data-cv', v);
    document.documentElement.classList.toggle('cv-light', v === 'c');
  }
  window.addEventListener('vlad:lang', function (e) { lang = e.detail; render(); });
  render();
  set('c');   // ← вариант обложки: 'a' — тёмная с хромовой «v», 'b' — тёмная с колесом карточек, 'c' — светлая
})();

/* ===== ЦВЕТА ← ИЗМЕНИТЬ: светлая тема (по умолчанию) и тёмная ===== */
.vr{--bg:#faf9f7;--fg:#15121f;--muted:#6b6779;--ac:#6a3dff;--ac2:#a58bff;--ink:#ffffff;--line:rgba(21,18,31,.09);--card:#ffffff;--soft:rgba(21,18,31,.03);--soft2:rgba(21,18,31,.05);--bd:rgba(21,18,31,.14);--bd2:rgba(21,18,31,.26);--chrome:#efedf3;--chrome2:#e2dfea;--dot:#cdc9d8;--frame:#f4f2f8;--view:#f1eff6;--shadow:rgba(40,25,90,.18)}
html[data-vtheme="dark"] .vr{--bg:#0e0b16;--fg:#f1eeff;--muted:#a19cb3;--ac:#8f6bff;--ac2:#b9a5ff;--ink:#ffffff;--line:rgba(241,238,255,.08);--card:#17131f;--soft:rgba(241,238,255,.03);--soft2:rgba(241,238,255,.06);--bd:rgba(241,238,255,.16);--bd2:rgba(241,238,255,.28);--chrome:#1f1a2a;--chrome2:#2a2438;--dot:#3a3348;--frame:#1a1624;--view:#120f1b;--shadow:rgba(0,0,0,.65)}

.vr{
  position:relative;background:var(--bg);color:var(--fg);font-family:'Manrope',system-ui,sans-serif;overflow:hidden;isolation:isolate;
  padding:120px 0;-webkit-font-smoothing:antialiased}
.vr *,.vr *::before,.vr *::after{box-sizing:border-box;margin:0;padding:0}
:where(.vr) a{color:inherit;text-decoration:none}
:where(.vr) button{font:inherit;color:inherit}
.vr-inner{max-width:1320px;margin:0 auto;padding:0 40px}

/* шапка */
.vr-head{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;margin-bottom:48px}
.vr-label{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.vr-label::before{content:'';width:28px;height:1px;background:var(--ac)}
.vr-title{margin-top:22px;font-family:'Unbounded',sans-serif;font-weight:800;font-size:clamp(30px,4vw,58px);line-height:1.06;letter-spacing:-.035em}
.vr-w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em;margin-bottom:-.1em}
.vr-wi{display:inline-block;transform:translateY(110%);transition:transform 1s cubic-bezier(.2,.8,.2,1) var(--d,0s)}
.vr-title.is-in .vr-wi{transform:none}
.vr-acc{color:var(--ac);font-family:'Playfair Display',serif;font-style:italic;font-weight:700;letter-spacing:-.01em}
.vr-arrows{display:flex;gap:10px;flex:none}
.vr-arrow{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;border:1px solid var(--bd);background:none;cursor:pointer;
  transition:background .25s,color .25s,border-color .25s,opacity .25s}
.vr-arrow:hover{background:var(--ac);color:var(--ink);border-color:var(--ac)}
.vr-arrow:disabled{opacity:.3;pointer-events:none}

/* слайдер */
.vr-track{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-ms-overflow-style:none;
  padding:6px max(40px,calc((100vw - 1320px) / 2 + 40px)) 24px;cursor:grab;-webkit-overflow-scrolling:touch}
.vr-track::-webkit-scrollbar{display:none}
.vr-track.is-drag{cursor:grabbing;scroll-snap-type:none}
.vr-track.is-drag *{pointer-events:none}
.vr-slide{flex:none;width:min(440px,82vw);scroll-snap-align:start;scroll-margin-left:max(40px,calc((100vw - 1320px) / 2 + 40px))}
.vr-card{position:relative;height:100%;min-height:440px;display:flex;flex-direction:column;padding:32px;border-radius:26px;background:var(--card);border:1px solid var(--line);
  transition:border-color .3s,transform .5s cubic-bezier(.2,.8,.2,1)}
.vr-card:hover{border-color:var(--bd);transform:translateY(-4px)}
.vr-tpl{position:absolute;z-index:3;top:16px;right:16px;background:var(--card);padding:5px 10px;border-radius:999px;border:1px dashed color-mix(in srgb,var(--ac) 50%,transparent);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ac)}

/* текстовый отзыв */
.vr-quote{width:44px;height:44px;color:var(--ac)}
.vr-stars{display:flex;gap:3px;margin-top:20px;color:var(--ac)}
.vr-stars svg{width:18px;height:18px}
.vr-text{margin-top:20px;font-size:18px;line-height:1.6;font-weight:500;flex:1}
.vr-author{display:flex;align-items:center;gap:14px;margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}
.vr-ava{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;overflow:hidden;background:var(--ac);color:var(--ink);font-family:'Unbounded',sans-serif;font-weight:800;font-size:18px}
.vr-ava img{width:100%;height:100%;object-fit:cover}
.vr-name{font-weight:700;font-size:16px}
.vr-role{margin-top:3px;font-size:13.5px;color:var(--muted)}
.vr-proj{margin-left:auto;flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);transition:background .25s,color .25s,transform .4s}
.vr-proj:hover{background:var(--ac);color:var(--ink);transform:rotate(-45deg)}

/* скриншот переписки */
.vr-chat{flex:1;display:grid;place-items:center;margin:-8px -8px 0;padding:18px;border-radius:18px;
  background:radial-gradient(circle at 50% 100%,color-mix(in srgb,var(--ac) 12%,transparent),transparent 65%)}
.vr-phone{position:relative;width:200px;height:290px;border-radius:26px;border:5px solid #26262b;background:#121418;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.7);
  transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.vr-card:hover .vr-phone{transform:rotate(-3deg) scale(1.03)}
.vr-phone img{width:100%;height:100%;object-fit:cover;object-position:top}
.vr-bub{position:absolute;left:12px;right:46px;height:30px;border-radius:14px 14px 14px 4px;background:#262a31}
.vr-bub.me{left:46px;right:12px;border-radius:14px 14px 4px 14px;background:color-mix(in srgb,var(--ac) 75%,#262a31)}
.vr-bub.b1{top:40px}.vr-bub.b2{top:80px;height:48px}.vr-bub.b3{top:138px}.vr-bub.b4{top:178px;height:62px}
.vr-heart{position:absolute;right:16px;top:226px;font-size:16px;animation:vr-beat 1.6s ease-in-out infinite}
@keyframes vr-beat{0%,100%{transform:scale(1)}15%{transform:scale(1.3)}30%{transform:scale(1)}}

/* видео */
.vr-video{position:relative;flex:1;display:grid;place-items:center;min-height:260px;margin:-8px -8px 0;border-radius:18px;overflow:hidden;cursor:pointer;border:0;width:calc(100% + 16px);
  background:linear-gradient(160deg,#1d1f24,#0f1013)}
.vr-video img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75;transition:opacity .4s,transform .8s cubic-bezier(.2,.8,.2,1)}
.vr-card:hover .vr-video img{opacity:.9;transform:scale(1.04)}
.vr-play{position:relative;display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:var(--ac);color:var(--ink);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.vr-play::before{content:'';position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--ac);opacity:.5;animation:vr-pulse 2s ease-out infinite}
@keyframes vr-pulse{0%{transform:scale(.85);opacity:.7}100%{transform:scale(1.35);opacity:0}}
.vr-play svg{width:30px;height:30px;margin-left:4px}
.vr-card:hover .vr-play{transform:scale(1.08)}
.vr-dur{position:absolute;left:16px;bottom:16px;padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700}

.vr-cap{margin-top:22px;font-size:16px;line-height:1.55;font-weight:500}

/* прогресс */
.vr-progress{max-width:1320px;margin:8px auto 0;padding:0 40px}
.vr-progress div{height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.vr-progress i{display:block;height:100%;width:30%;border-radius:inherit;background:var(--ac);transform-origin:left;transition:transform .15s linear}

/* призыв оставить отзыв */
.vr-ask{display:flex;align-items:center;justify-content:space-between;gap:24px;max-width:1320px;margin:48px auto 0;padding:0 40px}
.vr-ask p{font-size:16px;color:var(--muted)}
.vr-ask b{color:var(--fg)}
.vr-ask a{flex:none;display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 22px;border-radius:999px;border:1px solid var(--bd);font-weight:700;font-size:15px;
  transition:background .25s,color .25s,border-color .25s}
.vr-ask a:hover{background:var(--ac);color:var(--ink);border-color:var(--ac)}

/* окно с видео */
.vr-modal{position:fixed;inset:0;z-index:9999;display:none;place-items:center;padding:20px;background:rgba(5,5,7,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.vr-modal.is-open{display:grid;animation:vr-fade .3s ease}
@keyframes vr-fade{from{opacity:0}to{opacity:1}}
.vr-modal-box{position:relative;width:min(960px,100%);aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000}
.vr-modal-box.is-vert{width:min(420px,100%);aspect-ratio:9/16;max-height:86vh}
.vr-modal-box iframe,.vr-modal-box video{width:100%;height:100%;border:0;display:block}
.vr-close{position:absolute;top:18px;right:18px;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);font-size:22px;cursor:pointer}

/* появление */
.vr-r{opacity:0;transform:translateY(36px);transition:opacity .9s ease var(--d,0s),transform 1s cubic-bezier(.2,.8,.2,1) var(--d,0s)}
.vr-r.is-in{opacity:1;transform:none}

/* адаптив */
@media (max-width:760px){
  .vr{padding:80px 0}
  .vr-inner,.vr-progress,.vr-ask{padding:0 20px}
  .vr-head{margin-bottom:32px}
  .vr-arrows{display:none}
  .vr-track{padding:6px 20px 20px;cursor:auto}
  .vr-slide{scroll-margin-left:20px}
  .vr-card{min-height:400px;padding:26px 22px}
  .vr-text{font-size:16.5px}
  .vr-ask{flex-direction:column;align-items:flex-start}
  .vr-ask a{width:100%;justify-content:center}
}
@media (prefers-reduced-motion:reduce){
  .vr *{animation:none!important;transition:none!important}
  .vr .vr-r,.vr .vr-wi{opacity:1;transform:none}
}
</style>

<section class="vr" id="reviews" aria-label="Отзывы">
  <div class="vr-inner">
    <div class="vr-head">
      <div>
        <div class="vr-label vr-r"></div>
        <h2 class="vr-title"></h2>
      </div>
      <div class="vr-arrows vr-r" style="--d:.2s">
        <button type="button" class="vr-arrow vr-prev" aria-label="Назад"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
        <button type="button" class="vr-arrow vr-next" aria-label="Вперёд"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
    </div>
  </div>
  <div class="vr-track vr-r" style="--d:.15s"></div>
  <div class="vr-progress vr-r" style="--d:.2s"><div><i></i></div></div>
  <div class="vr-ask vr-r" style="--d:.25s"></div>
  <div class="vr-modal" role="dialog" aria-modal="true"><button type="button" class="vr-close" aria-label="Закрыть">✕</button><div class="vr-modal-box"></div></div>
</section>

<script>
(function () {
  /* =================================================================
     CONFIG — ВСЁ, ЧТО МОЖНО МЕНЯТЬ, НАХОДИТСЯ ЗДЕСЬ
     Тексты — в двух языках: uk и en. Цвета — в начале <style>.
     ================================================================= */
  var CONFIG = {
    telegram: 'https://t.me/Tim1949',          // ← ИЗМЕНИТЬ: кнопка «Залишити відгук»

    /* ОТЗЫВЫ — сейчас здесь ЗАГОТОВКИ. Замени их реальными отзывами и поставь template: false.
       type: 'text'  — текст (stars 0–5, 0 — не показывать; photo — фото клиента; link — сайт проекта)
       type: 'chat'  — скриншот переписки: image — ссылка на скрин
       type: 'video' — видео: video (YouTube или .mp4), poster (обложка), duration, vertical (true — вертикальное)
       Тексты отзыва — в uk / en (если отзыв на одном языке, можно вписать одинаковый текст в оба). */
    reviews: [                                                                  // ← ИЗМЕНИТЬ
      { type: 'text', template: true, stars: 0, photo: '', link: '',
        uk: { name: '[Ім’я клієнта]', role: '[Бізнес · місто]', text: '[Справжній відгук клієнта: що було до сайту, що сподобалося в роботі та що змінилося після запуску.]' },
        en: { name: '[Client name]', role: '[Business · city]', text: '[A real client review: what things were like before the site, what they liked about working together and what changed after launch.]' } },
      { type: 'chat', template: true, image: '',
        uk: { name: '[Ім’я клієнта]', role: '[Бізнес · місто]', text: '[Скриншот листування в Telegram чи Instagram, де клієнт дякує за сайт]' },
        en: { name: '[Client name]', role: '[Business · city]', text: '[Screenshot of a Telegram or Instagram chat where the client thanks you for the site]' } },
      { type: 'video', template: true, video: '', poster: '', duration: '0:30', vertical: false,
        uk: { name: '[Ім’я клієнта]', role: '[Бізнес · місто]', text: '[Короткий відеовідгук на 20–40 секунд]' },
        en: { name: '[Client name]', role: '[Business · city]', text: '[A short 20–40 second video review]' } },
      { type: 'text', template: true, stars: 0, photo: '', link: '',
        uk: { name: '[Ім’я клієнта]', role: '[Бізнес · місто]', text: '[Ще один справжній відгук. Найкраще працюють конкретні деталі: терміни, заявки, зручність спілкування.]' },
        en: { name: '[Client name]', role: '[Business · city]', text: '[Another real review. Specific details work best: timelines, leads, ease of communication.]' } }
    ],

    uk: { label: 'Відгуки', title: 'Що кажуть', titleAccent: 'клієнти', templateTag: 'Заготовка',
          ask: '<b>Ми вже працювали разом?</b> Буду радий вашому відгуку.', askButton: 'Залишити відгук',
          prev: 'Назад', next: 'Вперед', play: 'Дивитися відеовідгук', close: 'Закрити', open: 'Відкрити проєкт' },   // ← ИЗМЕНИТЬ
    en: { label: 'Reviews', title: 'What clients', titleAccent: 'say', templateTag: 'Template',
          ask: '<b>Have we worked together?</b> I’d love to hear your feedback.', askButton: 'Leave a review',
          prev: 'Previous', next: 'Next', play: 'Watch video review', close: 'Close', open: 'Open project' }               // ← ИЗМЕНИТЬ
  };
  /* ======================= дальше можно не трогать ======================= */

  var VL = window.VLAD_I18N || (window.VLAD_I18N = (function () {
    function detect() {
      try {
        var u = new URLSearchParams(location.search).get('lang');
        if (u === 'uk' || u === 'en') { localStorage.setItem('vlad-lang', u); return u; }
        var s = localStorage.getItem('vlad-lang'); if (s === 'uk' || s === 'en') return s;
      } catch (e) {}
      var nl = (navigator.language || '').toLowerCase();
      return (nl.indexOf('uk') === 0 || nl.indexOf('ru') === 0) ? 'uk' : 'en';
    }
    var api = { lang: detect() };
    document.documentElement.lang = api.lang;
    api.set = function (l) {
      if (l === api.lang) return;
      api.lang = l; document.documentElement.lang = l;
      try { localStorage.setItem('vlad-lang', l); } catch (e) {}
      try { var url = new URL(location.href); if (l === 'en') url.searchParams.set('lang', 'en'); else url.searchParams.delete('lang'); history.replaceState(null, '', url); } catch (e) {}
      window.dispatchEvent(new CustomEvent('vlad:lang', { detail: l }));
    };
    return api;
  })());

  var root = document.getElementById('reviews');
  if (!root) return;
  /* пока все отзывы — заготовки (template: true), блок скрыт. Появится сам, как только будет хоть один настоящий */
  if (CONFIG.reviews.every(function (r) { return r.template; })) { root.style.display = 'none'; return; }
  var q = function (s) { return root.querySelector(s); };
  var lang = VL.lang;

  var quoteSvg = '<svg class="vr-quote" viewBox="0 0 48 48" fill="currentColor" aria-hidden="true"><path d="M8 34c0-9 4-16 12-20l2 4c-4 2-6 5-6 9h6v12H8zm20 0c0-9 4-16 12-20l2 4c-4 2-6 5-6 9h6v12H28z"/></svg>';
  var star = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.3l-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9z"/></svg>';
  var arrow = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  var playSvg = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
  function initials(name) { var s = name.replace(/[\[\]]/g, '').trim(); return s ? s.charAt(0).toUpperCase() : '★'; }

  function render() {
    var T = CONFIG[lang] || CONFIG.uk;
    q('.vr-label').textContent = T.label;
    var html = '', n = 0;
    function addWords(text, cls) {
      text.split(' ').forEach(function (w) {
        if (!w) return;
        html += '<span class="vr-w"><span class="vr-wi' + (cls ? ' ' + cls : '') + '" style="--d:' + (n * 0.08).toFixed(2) + 's">' + w + '</span></span> ';
        n++;
      });
    }
    addWords(T.title, ''); addWords(T.titleAccent, 'vr-acc');
    q('.vr-title').innerHTML = html;
    q('.vr-prev').setAttribute('aria-label', T.prev);
    q('.vr-next').setAttribute('aria-label', T.next);
    q('.vr-close').setAttribute('aria-label', T.close);

    function author(r, t) {
      return '<div class="vr-author"><span class="vr-ava">' + (r.photo ? '<img src="' + r.photo + '" alt="">' : initials(t.name)) + '</span>' +
        '<div><p class="vr-name">' + t.name + '</p><p class="vr-role">' + t.role + '</p></div>' +
        (r.link ? '<a class="vr-proj" href="' + r.link + '" target="_blank" rel="noopener" aria-label="' + T.open + '">' + arrow + '</a>' : '') + '</div>';
    }
    q('.vr-track').innerHTML = CONFIG.reviews.map(function (r, i) {
      var t = r[lang] || r.uk;
      var tpl = r.template ? '<span class="vr-tpl">' + T.templateTag + '</span>' : '';
      var body;
      if (r.type === 'chat') {
        body = '<div class="vr-chat"><div class="vr-phone">' + (r.image ? '<img src="' + r.image + '" alt="">' :
          '<i class="vr-bub b1"></i><i class="vr-bub me b2"></i><i class="vr-bub b3"></i><i class="vr-bub b4"></i><span class="vr-heart">💜</span>') + '</div></div>' +
          '<p class="vr-cap">' + t.text + '</p>' + author(r, t);
      } else if (r.type === 'video') {
        body = '<button type="button" class="vr-video" data-i="' + i + '" aria-label="' + T.play + '">' + (r.poster ? '<img src="' + r.poster + '" alt="">' : '') +
          '<span class="vr-play">' + playSvg + '</span>' + (r.duration ? '<span class="vr-dur">' + r.duration + '</span>' : '') + '</button>' +
          '<p class="vr-cap">' + t.text + '</p>' + author(r, t);
      } else {
        var stars = r.stars ? '<div class="vr-stars">' + new Array(r.stars + 1).join(star) + '</div>' : '';
        body = quoteSvg + stars + '<p class="vr-text">' + t.text + '</p>' + author(r, t);
      }
      return '<div class="vr-slide"><article class="vr-card">' + tpl + body + '</article></div>';
    }).join('');

    var ext = /^https?:/.test(CONFIG.telegram) ? ' target="_blank" rel="noopener"' : '';
    q('.vr-ask').innerHTML = '<p>' + T.ask + '</p><a href="' + CONFIG.telegram + '"' + ext + '>' + T.askButton + ' ' + arrow + '</a>';
  }
  render();

  // слайдер: стрелки, прогресс, перетаскивание мышью
  var track = q('.vr-track'), prev = q('.vr-prev'), next = q('.vr-next'), bar = q('.vr-progress i');
  function step() { var s = track.querySelector('.vr-slide'); return s ? s.getBoundingClientRect().width + 16 : 400; }
  prev.addEventListener('click', function () { track.scrollBy({ left: -step(), behavior: 'smooth' }); });
  next.addEventListener('click', function () { track.scrollBy({ left: step(), behavior: 'smooth' }); });
  function onScroll() {
    var max = track.scrollWidth - track.clientWidth;
    var vis = track.clientWidth / track.scrollWidth;
    var p = max > 0 ? track.scrollLeft / max : 0;
    bar.style.width = Math.max(12, vis * 100) + '%';
    bar.style.transform = 'translateX(' + (p * (1 / Math.max(vis, 0.12) - 1) * 100) + '%)';
    prev.disabled = track.scrollLeft < 4;
    next.disabled = track.scrollLeft > max - 4;
    q('.vr-progress').style.visibility = max > 4 ? 'visible' : 'hidden';
  }
  track.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  onScroll();

  if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
    var down = false, sx = 0, sl = 0, moved = 0;
    track.addEventListener('pointerdown', function (e) { if (e.button !== 0) return; down = true; moved = 0; sx = e.clientX; sl = track.scrollLeft; });
    window.addEventListener('pointermove', function (e) {

    q('.vq-title').innerHTML = html;

    var h = T.help;
    var helpHtml = '<div class="vq-who"><span class="vq-ava">' + (CONFIG.photo ? '<img src="' + CONFIG.photo + '" alt="">' : h.initial) + '</span><div><b>' + h.name + '</b><span>' + h.status + '</span></div></div>' +
      '<p class="vq-help-text">' + h.text + '</p><span class="vq-typing" aria-hidden="true"><i></i><i></i><i></i></span>' +
      '<a class="vq-btn" href="' + CONFIG.telegram + '" target="_blank" rel="noopener">' + h.button + '<span class="vq-btn-ico">' + arrow + '</span></a>';
    root.querySelectorAll('.vq-help').forEach(function (el) { el.innerHTML = helpHtml; });

    q('.vq-list').innerHTML = T.items.map(function (it, i) {
      var open = i === openIdx;
      return '<div class="vq-item vq-r' + (open ? ' is-open' : '') + '" style="--d:' + Math.min(0.05 * i, 0.3).toFixed(2) + 's">' +
        '<button type="button" class="vq-q" aria-expanded="' + open + '" aria-controls="vq-a' + i + '" id="vq-q' + i + '">' +
        '<span class="vq-num">' + pad(i + 1) + '</span><span class="vq-qt">' + it.q + '</span><span class="vq-pm" aria-hidden="true"></span></button>' +
        '<div class="vq-a" id="vq-a' + i + '" role="region" aria-labelledby="vq-q' + i + '"><div><p>' + it.a + '</p></div></div></div>';
    }).join('');
    items = [].slice.call(root.querySelectorAll('.vq-item'));
    if (input.value) search();
  }

  q('.vq-list').addEventListener('click', function (e) {
    var b = e.target.closest('.vq-q'); if (!b) return;
    var it = b.parentNode, open = !it.classList.contains('is-open');
    items.forEach(function (x) { x.classList.remove('is-open'); x.querySelector('.vq-q').setAttribute('aria-expanded', 'false'); });
    openIdx = -1;
    if (open) { it.classList.add('is-open'); b.setAttribute('aria-expanded', 'true'); openIdx = items.indexOf(it); }
  });

  function esc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function search() {
    var T = CONFIG[lang] || CONFIG.uk;
    var raw = input.value.trim(), v = raw.toLowerCase(), shown = 0, first = null;
    items.forEach(function (it, i) {
      var data = T.items[i];
      var text = (data.q + ' ' + data.a.replace(/<[^>]+>/g, '')).toLowerCase();
      var ok = !v || text.indexOf(v) > -1;
      it.hidden = !ok;
      it.querySelector('.vq-qt').innerHTML = v && ok ? data.q.replace(new RegExp('(' + esc(raw) + ')', 'ig'), '<mark>$1</mark>') : data.q;
      if (ok) { shown++; if (!first) first = it; }
    });
    q('.vq-empty').classList.toggle('is-on', shown === 0);
    if (v && first && !first.classList.contains('is-open')) {
      items.forEach(function (x) { x.classList.remove('is-open'); });
      first.classList.add('is-open'); openIdx = items.indexOf(first);
    }
  }
  input.addEventListener('input', search);

  root.addEventListener('click', function (e) {
    var a = e.target.closest('a[href^="#"]'); if (!a) return;
    var id = a.getAttribute('href').slice(1);
    var t = id && (document.getElementById(id) || document.querySelector('[name="' + id + '"]'));
    if (t) { e.preventDefault(); t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  });

  render();
  window.addEventListener('vlad:lang', function (e) {
    lang = e.detail; render();
    root.querySelectorAll('.vq-r, .vq-title').forEach(function (el) { el.classList.add('is-in'); });
  });

  var reveal = [].slice.call(root.querySelectorAll('.vq-r, .vq-title'));
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (en) {
      en.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); } });
    }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });
    reveal.forEach(function (el) { io.observe(el); });
  } else {
    reveal.forEach(function (el) { el.classList.add('is-in'); });
  }
})();
</script>

    q('.vf-ok-box').textContent = text;
    var tg = q('.vf-ok-tg');
    tg.href = CONFIG.telegram + (CONFIG.telegram.indexOf('?') > -1 ? '&' : '?') + 'text=' + encodeURIComponent(text);
    tg.onclick = function () { copy(text); };
    var cb = q('.vf-ok-copy');
    cb.onclick = function () { copy(text).then(function () { cb.textContent = F.okCopied; setTimeout(function () { cb.textContent = F.okCopy; }, 2000); }); };
    form.classList.add('is-sent');
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (fCont.trim().length < 3) { var cI = form.querySelector('input[name=contact]'); cI.classList.add('is-err'); cI.focus(); return; }
    sent = true; fillOk();
  });

  // ---------- мини-игра «Злови баги» ----------
  var game = null;
  function makeGame() {
    var el = document.createElement('div');
    el.className = 'vf-game'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
    el.innerHTML = '<div class="vf-gbox"><div class="vf-ghead"><span class="vf-gtitle"></span>' +
      '<div class="vf-gstat acc"><small class="l-score"></small><b class="g-score">0</b></div>' +
      '<div class="vf-gstat"><small class="l-time"></small><b class="g-time">0</b></div>' +
      '<div class="vf-gstat"><small class="l-best"></small><b class="g-best">0</b></div>' +
      '<button type="button" class="vf-gclose">✕</button></div><div class="vf-gbar"><i></i></div>' +
      '<div class="vf-field"><div class="vf-gscreen g-start"></div><div class="vf-gscreen g-end" hidden></div></div></div>';
    document.body.appendChild(el);
    var $ = function (s) { return el.querySelector(s); };
    var field = $('.vf-field'), bugs = [], score = 0, left = 0, running = false, raf = 0, last = 0, spawnT = 0, best = 0;
    try { best = +localStorage.getItem('vlad-bugs-best') || 0; } catch (e) {}

    function plural(n, w) {
      if (lang !== 'uk') return n === 1 ? w[0] : w[1];
      var a = n % 10, b = n % 100;
      return a === 1 && b !== 11 ? w[0] : (a >= 2 && a <= 4 && (b < 10 || b >= 20)) ? w[1] : w[2];
    }
    function relabel() {
      var G = T().game;
      $('.vf-gtitle').textContent = G.title;
      $('.l-score').textContent = G.score; $('.l-time').textContent = G.time; $('.l-best').textContent = G.best;
      $('.vf-gclose').setAttribute('aria-label', G.close);
      $('.g-best').textContent = best;
      $('.g-start').innerHTML = '<div><div class="big">🐛</div><h3>' + G.title + '</h3><p>' + G.hint + '</p><div class="vf-gbtns"><button type="button" class="p g-go">' + G.start + ' →</button></div></div>';
      if (!running) $('.g-time').textContent = CONFIG.gameSeconds;
    }
    function spawn() {
      var r = field.getBoundingClientRect();
      var gold = Math.random() < 0.12;
      var b = { x: 40 + Math.random() * (r.width - 80), y: 40 + Math.random() * (r.height - 80), a: Math.random() * Math.PI * 2,
                v: (gold ? 150 : 70 + Math.random() * 60) * (1 + (CONFIG.gameSeconds - left) / CONFIG.gameSeconds * 0.9), life: gold ? 2.6 : 3.6 + Math.random() * 1.5, gold: gold, dead: false };
      b.el = document.createElement('button');
      b.el.type = 'button'; b.el.className = 'vf-bug' + (gold ? ' gold' : ''); b.el.setAttribute('aria-label', 'bug');
      b.el.innerHTML = '<span>' + (gold ? '🪲' : '🐛') + '</span>';
      b.el.addEventListener('pointerdown', function (e) { e.preventDefault(); hit(b); });
      field.appendChild(b.el);
      bugs.push(b);
    }
    function hit(b) {
      if (!running || b.dead) return;
      b.dead = true; b.el.classList.add('is-dead');
      var pts = b.gold ? 3 : 1; score += pts; $('.g-score').textContent = score;
      var p = document.createElement('span'); p.className = 'vf-pop'; p.textContent = '+' + pts; p.style.left = b.x + 'px'; p.style.top = b.y + 'px';
      field.appendChild(p); setTimeout(function () { p.remove(); }, 700);
      setTimeout(function () { b.el.remove(); }, 350);
    }
    function frame(ts) {
      if (!running) return;
      var dt = Math.min(0.05, (ts - last) / 1000); last = ts;
      left -= dt;
      var r = field.getBoundingClientRect();
      spawnT -= dt;
      var rate = 0.75 - (1 - left / CONFIG.gameSeconds) * 0.45;
      if (spawnT <= 0) { spawn(); spawnT = rate; }
      bugs.forEach(function (b) {
        if (b.dead) return;
        b.life -= dt;
        b.a += (Math.random() - 0.5) * 3 * dt;
        b.x += Math.cos(b.a) * b.v * dt; b.y += Math.sin(b.a) * b.v * dt;
        if (b.x < 28 || b.x > r.width - 28) { b.a = Math.PI - b.a; b.x = Math.max(28, Math.min(r.width - 28, b.x)); }
        if (b.y < 28 || b.y > r.height - 28) { b.a = -b.a; b.y = Math.max(28, Math.min(r.height - 28, b.y)); }
        var deg = b.a * 180 / Math.PI + 90;
        b.el.style.transform = 'translate3d(' + b.x.toFixed(1) + 'px,' + b.y.toFixed(1) + 'px,0) rotate(' + deg.toFixed(0) + 'deg)';
        if (b.life <= 0) { b.dead = true; b.el.classList.add('is-gone'); setTimeout(function () { b.el.remove(); }, 300); }
      });
      bugs = bugs.filter(function (b) { return !b.dead; });
      $('.g-time').textContent = Math.max(0, Math.ceil(left));
      $('.vf-gbar i').style.transform = 'scaleX(' + Math.max(0, left / CONFIG.gameSeconds).toFixed(3) + ')';
      if (left <= 0) return end();
      raf = requestAnimationFrame(frame);
    }
    function start() {
      field.querySelectorAll('.vf-bug,.vf-pop').forEach(function (x) { x.remove(); });
      bugs = []; score = 0; left = CONFIG.gameSeconds; spawnT = 0; running = true;
      $('.g-score').textContent = 0;
      $('.g-start').hidden = true; $('.g-end').hidden = true;
      last = performance.now(); raf = requestAnimationFrame(frame);
    }
    function end() {
      running = false; cancelAnimationFrame(raf);
      var G = T().game, isRec = score > best;
      if (isRec) { best = score; try { localStorage.setItem('vlad-bugs-best', best); } catch (e) {} }
      $('.g-best').textContent = best;
      bugs.forEach(function (b) { b.el.classList.add('is-gone'); });
      $('.g-end').hidden = false;
      $('.g-end').innerHTML = '<div><div class="big">' + (isRec ? '🏆' : '🐞') + '</div><h3>' + G.result.replace('{n}', score).replace('{w}', plural(score, G.words)) + '</h3>' +
        '<p>' + (isRec ? '<span class="rec">' + G.record + '</span><br>' : G.bestWas.replace('{n}', best) + '<br>') + G.text + '</p>' +
        '<div class="vf-gbtns"><button type="button" class="s g-go">↻ ' + G.again + '</button><a class="p" href="' + CONFIG.telegram + '"' + ext(CONFIG.telegram) + '>' + G.cta + ' →</a></div></div>';
    }
    function open() { relabel(); $('.g-start').hidden = false; $('.g-end').hidden = true; el.classList.add('is-open'); document.documentElement.style.overflow = 'hidden'; }
    function close() { running = false; cancelAnimationFrame(raf); el.classList.remove('is-open'); document.documentElement.style.overflow = ''; }
    el.addEventListener('click', function (e) {
      if (e.target.closest('.g-go')) start();
      else if (e.target.closest('.vf-gclose') || e.target === el) close();
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && el.classList.contains('is-open')) close(); });
    document.addEventListener('visibilitychange', function () { if (document.hidden && running) { last = performance.now(); } });
    relabel();
    return { open: open, relabel: relabel, el: el };
  }
  if (CONFIG.game) game = makeGame();
  root.addEventListener('click', function (e) { if (e.target.closest('[data-game]') && game) game.open(); });

  // плавная прокрутка по якорям + «Нагору»
  root.addEventListener('click', function (e) {
    if (e.target.closest('.vf-up')) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    var a = e.target.closest('a[href^="#"]'); if (!a) return;
    var id = a.getAttribute('href').slice(1);
    var t = id && (document.getElementById(id) || document.querySelector('[name="' + id + '"]'));
    if (t) { e.preventDefault(); t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  });

  // ---------- плавающая кнопка Telegram ----------
  var fl = document.querySelector('.vf-float');
  if (fl) {
    if (!CONFIG.floatingButton || !CONFIG.telegram) { fl.remove(); }
    else {
      document.body.appendChild(fl);
      fl.href = CONFIG.telegram;
      fl.innerHTML = I.tg + '<span class="vf-float-tip"></span>';
      var ticking = false;
      var upd = function () {
        ticking = false;
        var r = root.getBoundingClientRect();
        fl.classList.toggle('is-on', window.scrollY > window.innerHeight * 0.6 && r.top >= window.innerHeight * 0.7);
      };
      window.addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(upd); } }, { passive: true });
      upd();
    }
  }

  render();
  window.addEventListener('vlad:lang', function (e) {
    lang = e.detail; render();
    root.querySelectorAll('.vf-r, .vf-title').forEach(function (el) { el.classList.add('is-in'); });
  });

  // появление при прокрутке
  var reveal = [].slice.call(root.querySelectorAll('.vf-r, .vf-title'));
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (en) {
      en.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); } });
    }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });
    reveal.forEach(function (el) { io.observe(el); });
  } else {
    reveal.forEach(function (el) { el.classList.add('is-in'); });
  }
})();
</script>

</body>
