        var u = new URLSearchParams(location.search).get('lang');
        if (u === 'uk' || u === 'en') { localStorage.setItem('vlad-lang', u); return u; }
        var s = localStorage.getItem('vlad-lang'); if (s === 'uk' || s === 'en') return s;
      } catch (e) {}
      var nl = (navigator.language || '').toLowerCase();
      return (nl.indexOf('uk') === 0 || nl.indexOf('ru') === 0) ? 'uk' : 'en';
    }
    var api = { lang: detect() };
    document.documentElement.lang = api.lang;
    api.set = function (l) {
      if (l === api.lang) return;
      api.lang = l; document.documentElement.lang = l;
      try { localStorage.setItem('vlad-lang', l); } catch (e) {}
      try { var url = new URL(location.href); if (l === 'en') url.searchParams.set('lang', 'en'); else url.searchParams.delete('lang'); history.replaceState(null, '', url); } catch (e) {}
      window.dispatchEvent(new CustomEvent('vlad:lang', { detail: l }));
    };
    return api;
  })());

  var root = document.getElementById('contacts');
  if (!root) return;
  var q = function (s) { return root.querySelector(s); };
  var lang = VL.lang;
  function T() { return CONFIG[lang] || CONFIG.uk; }

  var I = {
    tg: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.4 4.3L2.9 11.4c-1.3.5-1.2 1.2-.2 1.5l4.7 1.5 1.8 5.6c.2.6.4.8.9.8.4 0 .6-.2.9-.4l2.3-2.2 4.7 3.5c.9.5 1.5.2 1.7-.8l3.1-14.6c.3-1.3-.5-1.9-1.4-1.5zM9.9 14.6l-.4 4 -1.4-4.6 10.5-6.6c.5-.3.9-.1.5.2z"/></svg>',
    wa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 20.5l1.3-4.2A8.5 8.5 0 1 1 8 19.4z"/><path d="M9 9.5c.3 1.6 1.9 3.6 3.6 4.5l1.3-1.2 2 1c-.3 1.2-1.3 1.8-2.3 1.6-2.9-.6-5.5-3.3-5.9-6.2-.1-1 .5-1.9 1.6-2.1l.9 1.9z"/></svg>',
    vb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c5 0 8 2.2 8 7.5S17 18 12 18c-.8 0-1.6-.1-2.3-.2L6 21v-4C4.5 15.7 4 13.4 4 10.5 4 5.2 7 3 12 3z"/><path d="M9.5 8.5c.4 2.3 2 4 4.5 4.6"/></svg>',
    ig: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg>',
    em: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/></svg>',
    ph: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>',
    ar: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
  };
  function ext(h) { return /^https?:/.test(h) ? ' target="_blank" rel="noopener"' : ''; }

  // ---------- состояние формы (переживает смену языка) ----------
  var form = q('.vf-form'), types = [], fName = '', fCont = '', fMsg = '', sent = false;

  function render() {
    var t = T(), F = t.form;
    // большая бегущая строка
    var half = '';
    for (var k = 0; k < 2; k++) t.bigText.forEach(function (w, i) { half += '<span' + (i === 1 ? ' class="f"' : '') + '>' + w + '</span><span class="s">✦</span>'; });
    q('.vf-big-track').innerHTML = half + half;

    q('.vf-label').textContent = t.label;
    q('.vf-lead').textContent = t.lead;
    var html = '', n = 0;
    function addWords(text, cls) {
      text.split(' ').forEach(function (w) {
        if (!w) return;
        html += '<span class="vf-w"><span class="vf-wi' + (cls ? ' ' + cls : '') + '" style="--d:' + (n * 0.08).toFixed(2) + 's">' + w + '</span></span> ';
        n++;
      });
    }
    addWords(t.title, ''); addWords(t.titleAccent, 'vf-acc');
    q('.vf-title').innerHTML = html;

    // контакты
    var c = t.ct, cts = [];
    if (CONFIG.telegram)  cts.push({ ico: I.tg, t: c.tg, s: CONFIG.tgName || c.tgSub, href: CONFIG.telegram, k: 'tg' });
    if (CONFIG.whatsapp)  cts.push({ ico: I.wa, t: c.wa, s: c.waSub, href: CONFIG.whatsapp, k: 'wa' });
    if (CONFIG.viber)     cts.push({ ico: I.vb, t: c.vb, s: c.vbSub, href: CONFIG.viber, k: 'vb' });
    if (CONFIG.instagram) cts.push({ ico: I.ig, t: c.ig, s: CONFIG.instagram.replace(/^https?:\/\/(www\.)?instagram\.com\//, '@').replace(/\/$/, ''), href: CONFIG.instagram, k: 'ig' });
    if (CONFIG.email)     cts.push({ ico: I.em, t: c.em, s: CONFIG.email, href: 'mailto:' + CONFIG.email, k: 'em' });
    if (CONFIG.phone)     cts.push({ ico: I.ph, t: c.ph, s: CONFIG.phone, href: 'tel:' + CONFIG.phone.replace(/[^\d+]/g, ''), k: 'ph' });
    q('.vf-contacts').innerHTML = cts.map(function (x, i) {
      return '<a class="vf-ct vf-r is-in" style="--d:' + (0.2 + 0.07 * i).toFixed(2) + 's" href="' + x.href + '"' + ext(x.href) + '><span class="vf-ct-ico">' + x.ico + '</span>' +
        '<span><b>' + x.t + '</b><small>' + x.s + '</small></span><span class="vf-ct-arr">' + I.ar + '</span></a>';
    }).join('');
    q('.vf-soc').innerHTML = cts.filter(function (x) { return x.k !== 'ph'; }).map(function (x) {
      return '<a href="' + x.href + '"' + ext(x.href) + ' aria-label="' + x.t + '">' + x.ico + '</a>';
    }).join('');

    // форма
    var privacy = F.privacy.replace(/\{([^}]+)\}/, CONFIG.privacyLink ? '<a href="' + CONFIG.privacyLink + '" target="_blank" rel="noopener">$1</a>' : '$1');
    q('.vf-step1').innerHTML = '<h3>' + F.title + '</h3><p class="vf-form-sub">' + F.sub + '</p>' +
      '<div class="vf-fields">' +
        '<label class="vf-fl"><input type="text" name="name" placeholder=" " autocomplete="name"><span>' + F.name + '</span></label>' +
        '<label class="vf-fl"><input type="text" name="contact" placeholder=" " autocomplete="tel"><span>' + F.contact + '</span></label>' +
        '<p class="vf-chips-l">' + F.typeLabel + '</p>' +
        '<div class="vf-chips">' + F.types.map(function (x, i) { return '<button type="button" class="vf-chip' + (types.indexOf(i) > -1 ? ' is-on' : '') + '" data-i="' + i + '">' + x + '</button>'; }).join('') + '</div>' +
        '<label class="vf-fl full"><textarea name="msg" placeholder=" " rows="3"></textarea><span>' + F.message + '</span></label>' +
      '</div>' +
      '<button type="submit" class="vf-submit"><span>' + F.submit + '</span><span class="vf-submit-ico">' + I.ar + '</span></button>' +
      '<p class="vf-privacy">' + privacy + '</p>';
    q('.vf-ok').innerHTML = '<span class="vf-ok-ico">' + I.ok + '</span><h3>' + F.okTitle + '</h3><p>' + F.okText + '</p><div class="vf-ok-box"></div>' +
      '<div class="vf-ok-btns"><a class="vf-ok-tg" target="_blank" rel="noopener">' + I.tg.replace('<svg ', '<svg width="20" height="20" ') + F.okTg + '</a>' +
      '<button type="button" class="vf-ok-copy">' + F.okCopy + '</button><button type="button" class="vf-ok-again">' + F.okAgain + '</button></div>' +
      (CONFIG.game ? '<button type="button" class="vf-gamebtn vf-okgame" data-game>' + F.okGame + '</button>' : '');
    var nI = form.querySelector('input[name=name]'), cI = form.querySelector('input[name=contact]'), mI = form.querySelector('textarea[name=msg]');
    nI.value = fName; cI.value = fCont; mI.value = fMsg;
    nI.addEventListener('input', function () { fName = nI.value; });
    cI.addEventListener('input', function () { fCont = cI.value; cI.classList.remove('is-err'); });
    mI.addEventListener('input', function () { fMsg = mI.value; });
    if (sent) fillOk();

    // футер
    q('.vf-nav').innerHTML = t.menu.map(function (m) { return '<a href="' + m.link + '">' + m.text + '</a>'; }).join('');
    q('.vf-word').innerHTML = CONFIG.logo.text + '<i>' + CONFIG.logo.accent + '</i>';
    q('.vf-foot-bot').innerHTML = '<span>© ' + new Date().getFullYear() + ' ' + t.copyright + '</span>' +
      (CONFIG.privacyLink ? '<a href="' + CONFIG.privacyLink + '" target="_blank" rel="noopener">' + t.privacyName + '</a>' : '') +
      (CONFIG.game ? '<button type="button" class="vf-gamebtn" data-game>' + t.gameBtn + '</button>' : '') +
      '<button type="button" class="vf-up">' + t.up + ' <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>';

    var fl = document.querySelector('.vf-float-tip'); if (fl) fl.textContent = t.floatingTip;
    renderNow();
    if (game) game.relabel();
  }

  // ---------- местное время ----------
  function renderNow() {
    var box = q('.vf-now'); if (!box) return;
    var t = T(), h = 0, txt = '';
    try {
      var fmt = function (tz) { return new Intl.DateTimeFormat('uk-UA', { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false }); };
      var f; try { f = fmt(CONFIG.timeZone); } catch (e) { f = fmt('Europe/Kiev'); }
      txt = f.format(new Date());
      h = parseInt(txt, 10);
    } catch (e) { box.style.display = 'none'; return; }
    var on = h >= CONFIG.workHours[0] && h < CONFIG.workHours[1];
    box.classList.toggle('is-on', on);
    box.querySelector('span').innerHTML = (on ? t.now.on : t.now.off).replace('{t}', txt);
  }
  setInterval(renderNow, 30000);

  // ---------- форма ----------
  form.addEventListener('click', function (e) {
    var c = e.target.closest('.vf-chip'); if (c) {
      var i = +c.getAttribute('data-i'), at = types.indexOf(i);
      if (at > -1) types.splice(at, 1); else types.push(i);
      c.classList.toggle('is-on', at < 0);
    }
    if (e.target.closest('.vf-ok-again')) { sent = false; form.classList.remove('is-sent'); }
  });
  function copy(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).catch(function () { legacy(text); });
    legacy(text); return Promise.resolve();
  }
  function legacy(text) {
    var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta);
  }
  function buildMsg() {
    var F = T().form, lines = [F.msgTitle, ''];
    if (types.length) lines.push(F.needMsg + ': ' + types.map(function (i) { return F.types[i]; }).join(', '));
    if (fMsg.trim()) lines.push(F.aboutMsg + ': ' + fMsg.trim());
    lines.push('');
    if (fName.trim()) lines.push(F.nameMsg + ': ' + fName.trim());
    lines.push(F.contactMsg + ': ' + fCont.trim());
    return lines.join('\n');
  }
  function fillOk() {
    var F = T().form, text = buildMsg();
    q('.vf-ok-box').textContent = text;
    var tg = q('.vf-ok-tg');
    tg.href = CONFIG.telegram + (CONFIG.telegram.indexOf('?') > -1 ? '&' : '?') + 'text=' + encodeURIComponent(text);
    tg.onclick = function () { copy(text); };
    var cb = q('.vf-ok-copy');
    cb.onclick = function () { copy(text).then(function () { cb.textContent = F.okCopied; setTimeout(function () { cb.textContent = F.okCopy; }, 2000); }); };
    form.classList.add('is-sent');
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (fCont.trim().length < 3) { var cI = form.querySelector('input[name=contact]'); cI.classList.add('is-err'); cI.focus(); return; }
    sent = true; fillOk();
  });

  // ---------- мини-игра «Злови баги» ----------
  var game = null;
  function makeGame() {
    var el = document.createElement('div');
    el.className = 'vf-game'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
    el.innerHTML = '<div class="vf-gbox"><div class="vf-ghead"><span class="vf-gtitle"></span>' +
      '<div class="vf-gstat acc"><small class="l-score"></small><b class="g-score">0</b></div>' +
      '<div class="vf-gstat"><small class="l-time"></small><b class="g-time">0</b></div>' +
      '<div class="vf-gstat"><small class="l-best"></small><b class="g-best">0</b></div>' +
      '<button type="button" class="vf-gclose">✕</button></div><div class="vf-gbar"><i></i></div>' +
      '<div class="vf-field"><div class="vf-gscreen g-start"></div><div class="vf-gscreen g-end" hidden></div></div></div>';
    document.body.appendChild(el);
    var $ = function (s) { return el.querySelector(s); };
    var field = $('.vf-field'), bugs = [], score = 0, left = 0, running = false, raf = 0, last = 0, spawnT = 0, best = 0;
    try { best = +localStorage.getItem('vlad-bugs-best') || 0; } catch (e) {}

    function plural(n, w) {
      if (lang !== 'uk') return n === 1 ? w[0] : w[1];
      var a = n % 10, b = n % 100;
      return a === 1 && b !== 11 ? w[0] : (a >= 2 && a <= 4 && (b < 10 || b >= 20)) ? w[1] : w[2];
    }
    function relabel() {
      var G = T().game;
      $('.vf-gtitle').textContent = G.title;
      $('.l-score').textContent = G.score; $('.l-time').textContent = G.time; $('.l-best').textContent = G.best;
      $('.vf-gclose').setAttribute('aria-label', G.close);
      $('.g-best').textContent = best;
      $('.g-start').innerHTML = '<div><div class="big">🐛</div><h3>' + G.title + '</h3><p>' + G.hint + '</p><div class="vf-gbtns"><button type="button" class="p g-go">' + G.start + ' →</button></div></div>';
      if (!running) $('.g-time').textContent = CONFIG.gameSeconds;
    }
    function spawn() {
      var r = field.getBoundingClientRect();
      var gold = Math.random() < 0.12;
      var b = { x: 40 + Math.random() * (r.width - 80), y: 40 + Math.random() * (r.height - 80), a: Math.random() * Math.PI * 2,
                v: (gold ? 150 : 70 + Math.random() * 60) * (1 + (CONFIG.gameSeconds - left) / CONFIG.gameSeconds * 0.9), life: gold ? 2.6 : 3.6 + Math.random() * 1.5, gold: gold, dead: false };
      b.el = document.createElement('button');
      b.el.type = 'button'; b.el.className = 'vf-bug' + (gold ? ' gold' : ''); b.el.setAttribute('aria-label', 'bug');
      b.el.innerHTML = '<span>' + (gold ? '🪲' : '🐛') + '</span>';
      b.el.addEventListener('pointerdown', function (e) { e.preventDefault(); hit(b); });
      field.appendChild(b.el);
      bugs.push(b);
    }
    function hit(b) {
      if (!running || b.dead) return;
      b.dead = true; b.el.classList.add('is-dead');
      var pts = b.gold ? 3 : 1; score += pts; $('.g-score').textContent = score;
      var p = document.createElement('span'); p.className = 'vf-pop'; p.textContent = '+' + pts; p.style.left = b.x + 'px'; p.style.top = b.y + 'px';
      field.appendChild(p); setTimeout(function () { p.remove(); }, 700);
      setTimeout(function () { b.el.remove(); }, 350);
    }
    function frame(ts) {
      if (!running) return;
      var dt = Math.min(0.05, (ts - last) / 1000); last = ts;
      left -= dt;
      var r = field.getBoundingClientRect();
      spawnT -= dt;
      var rate = 0.75 - (1 - left / CONFIG.gameSeconds) * 0.45;
      if (spawnT <= 0) { spawn(); spawnT = rate; }
      bugs.forEach(function (b) {
        if (b.dead) return;
        b.life -= dt;
        b.a += (Math.random() - 0.5) * 3 * dt;
        b.x += Math.cos(b.a) * b.v * dt; b.y += Math.sin(b.a) * b.v * dt;
        if (b.x < 28 || b.x > r.width - 28) { b.a = Math.PI - b.a; b.x = Math.max(28, Math.min(r.width - 28, b.x)); }
        if (b.y < 28 || b.y > r.height - 28) { b.a = -b.a; b.y = Math.max(28, Math.min(r.height - 28, b.y)); }
        var deg = b.a * 180 / Math.PI + 90;
        b.el.style.transform = 'translate3d(' + b.x.toFixed(1) + 'px,' + b.y.toFixed(1) + 'px,0) rotate(' + deg.toFixed(0) + 'deg)';
        if (b.life <= 0) { b.dead = true; b.el.classList.add('is-gone'); setTimeout(function () { b.el.remove(); }, 300); }
      });
      bugs = bugs.filter(function (b) { return !b.dead; });
      $('.g-time').textContent = Math.max(0, Math.ceil(left));
      $('.vf-gbar i').style.transform = 'scaleX(' + Math.max(0, left / CONFIG.gameSeconds).toFixed(3) + ')';
      if (left <= 0) return end();
      raf = requestAnimationFrame(frame);
    }
    function start() {
      field.querySelectorAll('.vf-bug,.vf-pop').forEach(function (x) { x.remove(); });
      bugs = []; score = 0; left = CONFIG.gameSeconds; spawnT = 0; running = true;
      $('.g-score').textContent = 0;
      $('.g-start').hidden = true; $('.g-end').hidden = true;
      last = performance.now(); raf = requestAnimationFrame(frame);
    }
    function end() {
      running = false; cancelAnimationFrame(raf);
      var G = T().game, isRec = score > best;
      if (isRec) { best = score; try { localStorage.setItem('vlad-bugs-best', best); } catch (e) {} }
      $('.g-best').textContent = best;
      bugs.forEach(function (b) { b.el.classList.add('is-gone'); });
      $('.g-end').hidden = false;
      $('.g-end').innerHTML = '<div><div class="big">' + (isRec ? '🏆' : '🐞') + '</div><h3>' + G.result.replace('{n}', score).replace('{w}', plural(score, G.words)) + '</h3>' +
        '<p>' + (isRec ? '<span class="rec">' + G.record + '</span><br>' : G.bestWas.replace('{n}', best) + '<br>') + G.text + '</p>' +
        '<div class="vf-gbtns"><button type="button" class="s g-go">↻ ' + G.again + '</button><a class="p" href="' + CONFIG.telegram + '"' + ext(CONFIG.telegram) + '>' + G.cta + ' →</a></div></div>';
    }
    function open() { relabel(); $('.g-start').hidden = false; $('.g-end').hidden = true; el.classList.add('is-open'); document.documentElement.style.overflow = 'hidden'; }
    function close() { running = false; cancelAnimationFrame(raf); el.classList.remove('is-open'); document.documentElement.style.overflow = ''; }
    el.addEventListener('click', function (e) {
      if (e.target.closest('.g-go')) start();
      else if (e.target.closest('.vf-gclose') || e.target === el) close();
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && el.classList.contains('is-open')) close(); });
    document.addEventListener('visibilitychange', function () { if (document.hidden && running) { last = performance.now(); } });
    relabel();
    return { open: open, relabel: relabel, el: el };
  }
  if (CONFIG.game) game = makeGame();
  root.addEventListener('click', function (e) { if (e.target.closest('[data-game]') && game) game.open(); });

  // плавная прокрутка по якорям + «Нагору»
  root.addEventListener('click', function (e) {
    if (e.target.closest('.vf-up')) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    var a = e.target.closest('a[href^="#"]'); if (!a) return;
    var id = a.getAttribute('href').slice(1);
    var t = id && (document.getElementById(id) || document.querySelector('[name="' + id + '"]'));
    if (t) { e.preventDefault(); t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  });

  // ---------- плавающая кнопка Telegram ----------
  var fl = document.querySelector('.vf-float');
  if (fl) {
    if (!CONFIG.floatingButton || !CONFIG.telegram) { fl.remove(); }
    else {
      document.body.appendChild(fl);
      fl.href = CONFIG.telegram;
      fl.innerHTML = I.tg + '<span class="vf-float-tip"></span>';
      var ticking = false;
      var upd = function () {
        ticking = false;
        var r = root.getBoundingClientRect();
        fl.classList.toggle('is-on', window.scrollY > window.innerHeight * 0.6 && r.top >= window.innerHeight * 0.7);
      };
      window.addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(upd); } }, { passive: true });
      upd();
    }
  }

  render();
  window.addEventListener('vlad:lang', function (e) {
    lang = e.detail; render();
    root.querySelectorAll('.vf-r, .vf-title').forEach(function (el) { el.classList.add('is-in'); });
  });

  // появление при прокрутке
  var reveal = [].slice.call(root.querySelectorAll('.vf-r, .vf-title'));
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (en) {
      en.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); } });
    }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });
    reveal.forEach(function (el) { io.observe(el); });
  } else {
    reveal.forEach(function (el) { el.classList.add('is-in'); });
  }
})();
</script>
